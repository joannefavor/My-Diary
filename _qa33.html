<!doctype html><meta charset="utf-8"><title>만남·선물 시험</title>
<div id="out" style="font:13px ui-monospace;white-space:pre">…</div>
<iframe id="f" src="/_fix_mtg.html#/meeting" style="width:1180px;height:1200px;border:0"></iframe>
<script>
var pass=0,fail=0,L=[];
function log(ok,name,got){ if(ok){pass++;L.push("통과  "+name);}
  else{fail++;L.push("X 실패  "+name+"   실제="+got);} }
window.onerror=function(m){L.push("X 실패  시험 창이 터짐: "+m);fail++;};
document.getElementById("f").onload=function(){var fr=this;
 fr.contentWindow.onerror=function(m,s,l){L.push("X 실패  앱이 터짐: "+m+" @"+l);fail++;};
 setTimeout(function(){
 var d=fr.contentDocument,w=fr.contentWindow;
 function done(){document.getElementById("out").textContent=
   L.join("\n")+"\n"+(fail?"X ":"")+"통과 "+pass+" · 실패 "+fail;}
 function saved(){return JSON.parse(w.localStorage.getItem("weekly-health-ledger-v3"));}
 function firstDay(){var s=saved().days;return s[Object.keys(s)[0]];}
 try{
  /* ── 만남 ── 이제 줄 목록이라 눌러서 펼친 뒤에 본다 */
  d.querySelector("#meetList [data-mrow]").click();
  var keys=Array.prototype.map.call(d.querySelectorAll("#meetList .vopen .mt-key"),
    function(x){return x.textContent;});
  log(keys.join("/")==="날짜/참석/내용","만남은 날짜·참석·내용 세 줄",keys.join("/"));
  log(!d.querySelector("#meetList [data-daypick]"),
    "내용 적는 칸에 달력 단추를 두지 않는다 — 패널 머리에 이미 있다","있음");
  log(!!d.querySelector('#meetList input[data-mtdate]'),
    "날짜는 칸 하나로 고친다","없음");
  log(!!d.querySelector('#meetList input[data-mtnew]'),
    "여기서 나온 할 일을 적는 칸이 있다","없음");

  /* 할 일을 넣어 본다 */
  var add=d.querySelector('#meetList input[data-mtnew]');
  add.value="자료 보내기";
  add.dispatchEvent(new w.Event("change",{bubbles:true}));
  log((firstDay().meetings[0].todos||[]).length===1,
    "만남에서 나온 할 일이 그 만남에 붙는다",
    JSON.stringify(firstDay().meetings[0].todos));

  /* ── 선물 ── */
  d.querySelector("#giftList [data-grow]").click();
  setTimeout(function(){
   try{
    var gk=Array.prototype.map.call(d.querySelectorAll("#giftList .vopen .mt-key"),
      function(x){return x.textContent;});
    log(gk.join("/")==="언제/누구/주고받음/무엇을/메모",
      "선물은 언제·누구·주고받음·무엇을·메모 — '무슨 일로' 를 없앴다",gk.join("/"));
    var pair=d.querySelector("#giftList .vopen .mt-pair");
    log(pair && pair.querySelectorAll(".viewtoggle").length===2,
      "받음·줌 과 물건·돈 이 한 줄에 선다",
      pair?pair.querySelectorAll(".viewtoggle").length:"줄 없음");

    /* 돈 — 화폐 단위로 적힌다 */
    var won=d.querySelector("#giftList .vopen input[data-giftwon]");
    log(!!won,"돈일 때는 화폐 칸이 나온다","없음");
    "200000".split("").forEach(function(ch){
      won.value=won.value+ch;
      won.dispatchEvent(new w.Event("input",{bubbles:true}));
    });
    log(won.value==="200,000원","적는 동안 세 자리마다 쉼표가 찍힌다",won.value);
    won.dispatchEvent(new w.Event("change",{bubbles:true}));
    log(firstDay().gift[0].amount===200000,
      "저장은 숫자로 한다 — 글자로 담으면 합산을 못 한다",
      JSON.stringify(firstDay().gift[0].amount));
    log(d.querySelector("#giftList .vs").textContent==="200,000원",
      "줄 요약에도 화폐 단위로 보인다",d.querySelector("#giftList .vs").textContent);

    /* 지웠다 다시 */
    won.value=""; won.dispatchEvent(new w.Event("input",{bubbles:true}));
    won.dispatchEvent(new w.Event("change",{bubbles:true}));
    log(firstDay().gift[0].amount===null,"비우면 없는 것으로 둔다",
      JSON.stringify(firstDay().gift[0].amount));

    /* 물건으로 바꾸면 글자 칸 */
    d.querySelector('#giftList .vopen button[data-giftkind="item"]').click();
    setTimeout(function(){
     try{
      log(!!d.querySelector('#giftList .vopen input[data-gift="what"]'),
        "물건으로 바꾸면 무엇을 적는 칸이 된다","없음");
      log(!d.querySelector('.vopen input[data-giftwon]'),
        "그때는 화폐 칸을 두지 않는다","남아 있음");
     }catch(e){fail++;L.push("X 실패  "+e.message);}
     done();
    },400);
   }catch(e){fail++;L.push("X 실패  "+e.message);done();}
  },400);
 }catch(e){fail++;L.push("X 실패  "+e.message);done();}
},1600);};
</script>
