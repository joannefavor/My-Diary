<!doctype html><meta charset="utf-8"><title>본 것 — 빠르게 쓰기·찾기 시험</title>
<div id="out" style="font:13px/1.7 ui-monospace"></div>
<iframe id="f" src="/#/main" style="width:1240px;height:100px;border:0"></iframe>
<script>
var out=document.getElementById("out"),f=document.getElementById("f"),pass=0,fail=0;
function log(ok,n,e){(ok?pass++:fail++);
 out.insertAdjacentHTML("beforeend",(ok?"통과  ":"X 실패  ")+n+(e?"   "+e:"")+"<br>");}
function ev(w,el,t){el.dispatchEvent(new w.Event(t,{bubbles:true}));}
f.onload=function(){var w=f.contentWindow,d=w.document;
 w.onerror=function(m,s,l){log(false,"앱 오류",m+" ("+l+"줄)");};
 setTimeout(function(){
  try{w.localStorage.removeItem("weekly-health-ledger-v3");}catch(e){}
  log(!!d.querySelector('#pageTabs button[data-goto="seen"]'),"'본 것' 탭이 있다");

  /* 빠르게 쓰기 — 대표 갈래는 영화, 나머지는 태그로 */
  var pick=d.querySelector('#quickPicks button[data-pick="movie"]');
  log(!!pick,"빠르게 쓰기에 '본 것' 단추가 있다",pick&&pick.textContent);
  pick.click();
  function quick(t){var ta=d.getElementById("quickText");ta.value=t;ev(w,ta,"input");
   d.getElementById("quickAdd").click();}
  quick("오펜하이머");
  quick("#여행 속초");
  quick("#책 총, 균, 쇠");
  quick("#공연 김광석 다시부르기");
  quick("#강의 파이썬 기초");
  setTimeout(function(){
   var st=JSON.parse(w.localStorage.getItem("weekly-health-ledger-v3")||"{}");
   var got={trip:[],movie:[],show:[],lecture:[],book:[]};
   Object.keys(st.days||{}).forEach(function(k){
    Object.keys(got).forEach(function(g){
     ((st.days[k][g])||[]).forEach(function(v){got[g].push(v.place||v.title);});});});
   log(got.movie.length===1&&got.movie[0]==="오펜하이머","갈래를 안 적으면 영화로",got.movie.join(","));
   log(got.trip.length===1&&got.trip[0]==="속초","#여행 은 여행으로, 가는 곳이 '어디에'",got.trip.join(","));
   log(got.book.length===1&&got.book[0]==="총, 균, 쇠","#책 은 책으로",got.book.join(","));
   log(got.show.length===1,"#공연 은 공연으로",got.show.join(","));
   log(got.lecture.length===1,"#강의 는 강의로",got.lecture.join(","));

   /* 빠르게 찾기에 다섯 갈래가 다 걸리나 */
   var fi=d.getElementById("findAll");
   function find(q,cb){fi.value=q;ev(w,fi,"input");setTimeout(cb,300);}
   find("속초",function(){
    var t1=d.getElementById("findList").textContent;
    log(t1.indexOf("여행")!==-1&&t1.indexOf("속초")!==-1,"여행이 찾기에 걸린다",t1.slice(0,34).trim());
    find("총, 균",function(){
     var t2=d.getElementById("findList").textContent;
     log(t2.indexOf("책")!==-1,"책이 찾기에 걸린다",t2.slice(0,34).trim());
     find("김광석",function(){
      log(d.getElementById("findList").textContent.indexOf("공연")!==-1,"공연이 찾기에 걸린다");
      out.insertAdjacentHTML("beforeend","<b>통과 "+pass+" · 실패 "+fail+"</b>");
     });
    });
   });
  },600);
 },900);};
</script>
