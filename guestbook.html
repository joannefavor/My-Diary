<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>방명록 — 주간 기록부</title>
<meta name="description" content="주간 기록부 방문자 방명록">

<meta name="theme-color" media="(prefers-color-scheme: light)" content="#f3f4f7">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0d1014">

<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">

<style>
  /* 색·글꼴은 기록부 화면과 같은 값을 쓴다.
     테마 변수는 세 곳(밝음 / 시스템 어두움 / 직접 어두움)에 모두 넣어야 한다.
     하나라도 빠지면 어느 한쪽에서 조용히 깨진다. */
  :root {
    color-scheme: light;
    --plane:        #f3f4f7;
    --surface:      #fbfbfc;
    --surface-2:    #f6f7fa;
    --ink:          #12161c;
    --ink-2:        #565c66;
    --muted:        #868d97;
    --hair:         #e2e5ea;
    --baseline:     #c8cdd4;
    --accent:       #1d3a5f;
    --on-accent:    #fbfbfc;
    --accent-soft:  #dfe7f1;
    --critical:     #d03b3b;
    --good:         #0ca30c;
    --shadow: 0 1px 2px rgba(18,22,28,.05), 0 8px 24px -16px rgba(18,22,28,.18);

    --serif: ui-serif, "Iowan Old Style", "Palatino Linotype", Palatino, "Source Serif Pro", Georgia, serif;
    --sans: system-ui, -apple-system, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --plane:       #0d1014;
      --surface:     #161a20;
      --surface-2:   #1c2128;
      --ink:         #f1f3f6;
      --ink-2:       #a7afba;
      --muted:       #7b838e;
      --hair:        #262c35;
      --baseline:    #363d47;
      --accent:      #9dbfe8;
      --on-accent:   #0d1014;
      --accent-soft: #1e2b3c;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px -16px rgba(0,0,0,.7);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --plane:       #0d1014;
    --surface:     #161a20;
    --surface-2:   #1c2128;
    --ink:         #f1f3f6;
    --ink-2:       #a7afba;
    --muted:       #7b838e;
    --hair:        #262c35;
    --baseline:    #363d47;
    --accent:      #9dbfe8;
    --on-accent:   #0d1014;
    --accent-soft: #1e2b3c;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px -16px rgba(0,0,0,.7);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--plane);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 14px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }

  .wrap {
    max-width: 780px;
    margin: 0 auto;
    padding: 32px 24px 72px;
    display: flex; flex-direction: column; gap: 20px;
  }

  .masthead {
    display: flex; flex-wrap: wrap; align-items: flex-end;
    justify-content: space-between; gap: 16px 24px;
    padding-bottom: 18px;
    border-bottom: 2px solid var(--accent);
  }
  .masthead h1 {
    font-family: var(--serif);
    font-size: 30px; font-weight: 600; line-height: 1.1;
    letter-spacing: -.01em; margin: 0;
  }
  .eyebrow {
    font-family: var(--mono); font-size: 10.5px;
    letter-spacing: .14em; text-transform: uppercase;
    color: var(--muted); margin: 0 0 6px;
  }
  .back {
    font-size: 13px; color: var(--ink-2); text-decoration: none;
    border: 1px solid var(--hair); border-radius: 7px; padding: 6px 11px;
    background: var(--surface);
  }
  .back:hover { background: var(--surface-2); border-color: var(--baseline); }

  .panel {
    background: var(--surface);
    border: 1px solid var(--hair); border-radius: 11px;
    box-shadow: var(--shadow); overflow: hidden;
  }
  .panel > header {
    display: flex; flex-wrap: wrap; align-items: baseline;
    justify-content: space-between; gap: 6px 12px;
    padding: 14px 16px 12px; border-bottom: 1px solid var(--hair);
  }
  .panel h2 {
    font-family: var(--serif); font-size: 16.5px; font-weight: 600;
    margin: 0; letter-spacing: -.005em;
  }
  .panel header .hint { font-size: 11.5px; color: var(--muted); }
  .panel-body { padding: 15px 16px 17px; }

  .field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
  .field > label {
    font-family: var(--mono); font-size: 9.5px; letter-spacing: .12em;
    text-transform: uppercase; color: var(--muted);
  }
  .field input[type="text"], .field textarea {
    font: inherit; font-size: 13.5px;
    background: var(--surface); color: var(--ink);
    border: 1px solid var(--hair); border-radius: 7px;
    padding: 8px 10px; width: 100%;
  }
  .field textarea { resize: vertical; min-height: 84px; }
  .field input:focus-visible, .field textarea:focus-visible {
    outline: 2px solid var(--accent); outline-offset: -1px;
  }
  .form-rows { display: flex; flex-direction: column; gap: 11px; }
  .form-foot { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
  .form-foot .spacer { flex: 1; }
  .count { font-family: var(--mono); font-size: 11px; color: var(--muted); }

  button {
    font: inherit; color: var(--ink);
    background: var(--surface);
    border: 1px solid var(--hair); border-radius: 7px;
    padding: 7px 15px; cursor: pointer;
  }
  button:hover:not(:disabled) { background: var(--surface-2); border-color: var(--baseline); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button.primary {
    background: var(--accent); border-color: var(--accent);
    color: var(--on-accent); font-weight: 600;
  }
  button.primary:hover:not(:disabled) { opacity: .9; background: var(--accent); }
  button:disabled { opacity: .45; cursor: not-allowed; }

  .say { font-size: 12.5px; color: var(--ink-2); min-height: 18px; line-height: 1.5; }
  .say[data-tone="bad"] { color: var(--critical); }
  .say[data-tone="ok"]  { color: var(--good); }

  .entries { list-style: none; margin: 0; padding: 0; }
  .entry { padding: 13px 16px; border-top: 1px solid var(--hair); }
  .entry:first-child { border-top: 0; }
  .entry-head {
    display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px;
    margin-bottom: 3px;
  }
  .entry-name { font-weight: 600; font-size: 13.5px; }
  .entry-time { font-family: var(--mono); font-size: 11px; color: var(--muted); }
  .entry-msg { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; color: var(--ink-2); }

  .placeholder { padding: 22px 16px; color: var(--muted); font-size: 13px; text-align: center; }

  @media (max-width: 640px) {
    .wrap { padding: 22px 14px 56px; gap: 16px; }
    .masthead h1 { font-size: 24px; }
  }
</style>
</head>
<body>

<div class="wrap">

  <header class="masthead">
    <div>
      <p class="eyebrow">Weekly Ledger · 방명록</p>
      <h1>방명록</h1>
    </div>
    <a class="back" href="/">← 기록부로 돌아가기</a>
  </header>

  <section class="panel">
    <header>
      <h2>글 남기기</h2>
      <span class="hint">이름은 비워두면 ‘익명’으로 남습니다</span>
    </header>
    <div class="panel-body">
      <form class="form-rows" id="form" autocomplete="off">
        <div class="field">
          <label for="name">이름</label>
          <input type="text" id="name" maxlength="40" placeholder="예: 연이">
        </div>
        <div class="field">
          <label for="message">메시지</label>
          <textarea id="message" maxlength="500" placeholder="남기고 싶은 말을 적어주세요"></textarea>
        </div>
        <div class="form-foot">
          <span class="count" id="count">0 / 500</span>
          <span class="spacer"></span>
          <button type="submit" class="primary" id="submit" disabled>남기기</button>
        </div>
      </form>
      <div class="say" id="say" role="status" aria-live="polite"></div>
    </div>
  </section>

  <section class="panel">
    <header>
      <h2>남겨진 글</h2>
      <span class="hint" id="total"></span>
    </header>
    <ul class="entries" id="entries"></ul>
    <div class="placeholder" id="placeholder">불러오는 중…</div>
  </section>

</div>

<script>
(function () {
  "use strict";

  var elForm = document.getElementById("form");
  var elName = document.getElementById("name");
  var elMsg = document.getElementById("message");
  var elSubmit = document.getElementById("submit");
  var elCount = document.getElementById("count");
  var elSay = document.getElementById("say");
  var elList = document.getElementById("entries");
  var elHolder = document.getElementById("placeholder");
  var elTotal = document.getElementById("total");

  function say(msg, tone) {
    elSay.textContent = msg || "";
    if (tone) elSay.setAttribute("data-tone", tone);
    else elSay.removeAttribute("data-tone");
  }

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function whenText(iso) {
    var d = new Date(iso);
    if (isNaN(d)) return "";
    var now = new Date();
    var sameDay = d.toDateString() === now.toDateString();
    return sameDay
      ? "오늘 " + d.toLocaleTimeString("ko-KR", { hour: "2-digit", minute: "2-digit" })
      : d.toLocaleString("ko-KR", { month: "long", day: "numeric", hour: "2-digit", minute: "2-digit" });
  }

  /* 빈 메시지는 보내지 못하게 화면에서 막는다. 서버에서도 한 번 더 막는다. */
  function refreshButton() {
    var n = elMsg.value.trim().length;
    elSubmit.disabled = n === 0;
    elCount.textContent = elMsg.value.length + " / 500";
  }
  elMsg.addEventListener("input", refreshButton);

  function paint(entries) {
    elList.innerHTML = entries.map(function (e) {
      return '<li class="entry">' +
        '<div class="entry-head">' +
          '<span class="entry-name">' + esc(e.name || "익명") + "</span>" +
          '<span class="entry-time">' + esc(whenText(e.created_at)) + "</span>" +
        "</div>" +
        '<p class="entry-msg">' + esc(e.message) + "</p>" +
      "</li>";
    }).join("");

    if (entries.length) {
      elHolder.hidden = true;
      elTotal.textContent = entries.length + "개";
    } else {
      elHolder.hidden = false;
      elHolder.textContent = "아직 남겨진 글이 없습니다. 첫 글을 남겨보세요.";
      elTotal.textContent = "";
    }
  }

  function load() {
    return fetch("/api/guestbook", { cache: "no-store" })
      .then(function (r) {
        return r.json().catch(function () { return {}; }).then(function (j) {
          if (!r.ok) throw new Error(j.error || "글을 불러오지 못했습니다.");
          return j;
        });
      })
      .then(function (j) { paint(j.entries || []); })
      .catch(function (err) {
        elList.innerHTML = "";
        elHolder.hidden = false;
        elHolder.textContent = err.message;
        elTotal.textContent = "";
      });
  }

  elForm.addEventListener("submit", function (e) {
    e.preventDefault();
    var message = elMsg.value.trim();
    if (!message) { say("메시지를 적어주세요.", "bad"); return; }

    elSubmit.disabled = true;
    elSubmit.textContent = "남기는 중…";
    say("");

    fetch("/api/guestbook", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name: elName.value.trim(), message: message })
    })
      .then(function (r) {
        return r.json().catch(function () { return {}; }).then(function (j) {
          if (!r.ok) throw new Error(j.error || "글을 남기지 못했습니다.");
          return j;
        });
      })
      .then(function () {
        elMsg.value = "";
        refreshButton();
        say("남겼습니다.", "ok");
        return load();
      })
      .catch(function (err) { say(err.message, "bad"); })
      .then(function () {
        elSubmit.textContent = "남기기";
        refreshButton();
      });
  });

  refreshButton();
  load();
})();
</script>

</body>
</html>
