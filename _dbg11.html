<!doctype html><meta charset="utf-8"><div id="out" style="font:12px ui-monospace;white-space:pre">…</div>
<iframe id="f" src="/_fix_recent.html#/seen" style="width:1240px;height:80px;border:0"></iframe>
<script>
var f=document.getElementById("f"),o=document.getElementById("out");
f.onload=function(){setTimeout(function(){var w=f.contentWindow,d=f.contentDocument;
 var L=d.getElementById("movieList"),X=[];
 X.push("패널: "+[].map.call(d.querySelectorAll('section.panel[data-page="seen"] h2'),
   function(h){return h.textContent;}).join(" | "));
 X.push("펼친 칸: "+L.querySelectorAll(".mt").length+"개");
 X.push("요약 줄: "+L.querySelectorAll("[data-nrow]").length+"줄");
 [].forEach.call(L.querySelectorAll("[data-nrow]"),function(r){
  X.push("   "+r.querySelector(".vd").textContent.trim()+"  "+
    r.querySelector(".vp").textContent+"  —  "+r.querySelector(".vs").textContent);});
 var m=L.querySelector(".pasttitle .more");
 X.push("더: "+(m?m.textContent.trim():"없음"));
 var st=JSON.parse(w.localStorage.getItem("weekly-health-ledger-v3"));
 var mv=0,sh=0;Object.keys(st.days).forEach(function(k){
  mv+=((st.days[k].movie)||[]).length; sh+=((st.days[k].show)||[]).length;});
 X.push("저장: 영화 "+mv+"건, 공연 "+sh+"건");
 o.textContent=X.join("\n");
},1200);};
</script>
