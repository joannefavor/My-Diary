<script>
(function () {
  "use strict";

  var STORE = "weekly-health-ledger-v3";
  var DOW = ["월", "화", "수", "목", "금", "토", "일"];
  var MEALS = [["b", "아침"], ["l", "점심"], ["d", "저녁"]];

  /* ============================ 판정 기준 ============================ */

  // 혈압(mmHg) — 대한고혈압학회 진료지침 구간
  function bpStatus(s, d) {
    if (s == null || d == null) return null;
    if (s >= 160 || d >= 100) return { key: "critical", label: "2기 고혈압" };
    if (s >= 140 || d >= 90)  return { key: "serious",  label: "1기 고혈압" };
    if (s >= 130 || d >= 85)  return { key: "warning",  label: "주의혈압" };
    if (s < 90 || d < 60)     return { key: "warning",  label: "낮음" };
    return { key: "good", label: "정상" };
  }
  // 공복혈당(mg/dL)
  function glucoseStatus(g) {
    if (g == null) return null;
    if (g >= 126) return { key: "critical", label: "당뇨 범위" };
    if (g >= 100) return { key: "warning",  label: "공복혈당장애" };
    if (g < 70)   return { key: "warning",  label: "낮음" };
    return { key: "good", label: "정상" };
  }
  // 수면 — 취침·기상 시각에서 잔 시간을 계산한다. 자정을 넘기면 다음 날로 넘어간 것으로 본다.
  /* "HH:MM" → 자정부터의 분. 수면 계산과 일정 타임라인이 함께 쓴다. */
  function toMin(t) {
    var m = /^(\d{1,2}):(\d{2})$/.exec(String(t || ""));
    if (!m) return null;
    var h = +m[1], mi = +m[2];
    return h > 23 || mi > 59 ? null : h * 60 + mi;
  }
  function sleepHours(x) {
    if (!x || x.sleep == null) return null;
    if (typeof x.sleep === "number") return x.sleep;      // 예전 형식(시간 숫자)도 그대로 읽는다
    var a = toMin(x.sleep.from), b = toMin(x.sleep.to);
    if (a == null || b == null) return null;
    var diff = b - a;
    if (diff < 0) diff += 1440;                           // 자정을 넘겨 잔 경우
    if (diff === 0) return null;
    return Math.round(diff / 60 * 100) / 100;
  }
  function sleepRange(x) {
    if (!x || !x.sleep || typeof x.sleep === "number") return null;
    return (x.sleep.from && x.sleep.to) ? x.sleep.from + "–" + x.sleep.to : null;
  }
  function fmtDur(h) {
    if (h == null) return "—";
    var mins = Math.round(h * 60);
    var hh = Math.floor(mins / 60), mm = mins % 60;
    return hh + "시간" + (mm ? " " + mm + "분" : "");
  }

  // 수면 — 성인 권장 7~9시간
  function sleepStatus(h) {
    if (h == null) return null;
    if (h >= 9.5) return { key: "warning", label: "과다" };
    if (h >= 7)   return { key: "good",    label: "충분" };
    if (h >= 6)   return { key: "warning", label: "약간 부족" };
    return { key: "serious", label: "부족" };
  }
  // 운동 — 주 150분(WHO 권고)
  function exerciseStatus(total) {
    if (total >= 150) return { key: "good",    label: "권고 충족" };
    if (total >= 75)  return { key: "warning", label: "절반 이상" };
    return { key: "serious", label: "부족" };
  }
  // 수분 — 하루 8잔 기준
  function waterStatus(avg) {
    if (avg == null) return null;
    if (avg >= 8) return { key: "good",    label: "충분" };
    if (avg >= 5) return { key: "warning", label: "조금 부족" };
    return { key: "serious", label: "부족" };
  }
  function rateStatus(pct) {
    if (pct == null) return null;
    if (pct >= 90) return { key: "good",    label: Math.round(pct) + "% 지킴" };
    if (pct >= 60) return { key: "warning", label: Math.round(pct) + "% 지킴" };
    return { key: "serious", label: Math.round(pct) + "% 지킴" };
  }

  var GLYPH = { good: "●", warning: "▲", serious: "▲", critical: "■" };
  function pill(st) {
    if (!st) return '<span class="pill">기록 없음</span>';
    return '<span class="pill ' + st.key + '"><span class="glyph" aria-hidden="true">' +
      GLYPH[st.key] + "</span>" + esc(st.label) + "</span>";
  }

  /* ============================ 날짜 ============================ */

  function pad(n) { return (n < 10 ? "0" : "") + n; }
  function iso(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
  function parseISO(s) { var p = s.split("-"); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function mondayOf(d) {
    var x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    x.setDate(x.getDate() - ((x.getDay() + 6) % 7));
    return x;
  }
  function addDays(d, n) {
    var x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    x.setDate(x.getDate() + n);
    return x;
  }
  var TODAY = iso(new Date());

  /* ============================ 상태 ============================ */

  /* days는 날짜별 기록, meds는 "내가 먹는 약" 목록(설정) */
  var state = { days: {}, meds: [] };
  var weekStart = mondayOf(new Date());
  var selected = TODAY;

  function blank() {
    return {
      schedule: [], todos: [], sleep: null, bp: null, glucose: null, weight: null,
      exercise: null, water: null,
      meals: { b: false, l: false, d: false },
      menu: { b: "", l: "", d: "" },
      pill: { b: "", l: "", d: "" },
      meds: false, medTaken: {}, mood: null, condition: null, overall: null, note: ""
    };
  }
  function day(date) {
    if (!state.days[date]) state.days[date] = blank();
    var d = state.days[date];
    if (!d.meals) d.meals = { b: false, l: false, d: false };
    if (!d.menu) d.menu = { b: "", l: "", d: "" };
    if (!d.pill) d.pill = { b: "", l: "", d: "" };
    if (!d.medTaken) d.medTaken = {};
    if (!d.schedule) d.schedule = [];
    if (!d.todos) d.todos = [];
    return d;
  }
  function peek(date) { return state.days[date] || null; }

  /* 식단은 나중에 생긴 항목이라 예전 기록에는 없다 */
  function menuOf(d, k) { return (d && d.menu && d.menu[k]) || ""; }
  /* 끼니별로 적어둔 약. 나중에 생긴 항목이라 예전 기록에는 없다 */
  function pillOf(d, k) { return (d && d.pill && d.pill[k]) || ""; }
  function pillMeals(x) {
    return MEALS.filter(function (m) { return pillOf(x, m[0]); });
  }

  /* ---------- 복약 ----------
     약 목록을 만들기 전에는 하루 한 번 눌러 두는 방식이었다.
     목록이 생긴 뒤에도 그때 '복용함'으로 적어둔 날은 복용한 날로 남긴다. */
  function medList() { return state.meds || (state.meds = []); }
  function medTakenCount(x) {
    if (!x || !x.medTaken) return 0;
    return medList().filter(function (m) { return x.medTaken[m.id]; }).length;
  }
  function medDone(x) {
    if (!x) return false;
    if (pillMeals(x).length) return true;                 // 끼니별로 적어둔 약이 있으면 복용한 날
    return medList().length ? (medTakenCount(x) > 0 || !!x.meds) : !!x.meds;
  }
  /* 일정은 id로 식별한다. 예전 기록에는 id가 없으므로 읽을 때 채워 넣는다. */
  var uidSeq = 0;
  function uid() { return "e" + Date.now().toString(36) + (uidSeq++).toString(36); }
  function normalize() {
    Object.keys(state.days).forEach(function (date) {
      var d = state.days[date];
      if (!d || !d.schedule) return;
      d.schedule.forEach(function (it) { if (!it.id) it.id = uid(); });
    });
  }

  function load() {
    try {
      var raw = localStorage.getItem(STORE);
      if (raw) {
        var p = JSON.parse(raw);
        if (p && typeof p === "object" && p.days) {
          state = { days: p.days, meds: Array.isArray(p.meds) ? p.meds : [] };
          normalize();
          return true;
        }
      }
    } catch (e) { /* 저장소를 못 읽으면 빈 상태로 시작 */ }
    return false;
  }
  function save() {
    try {
      localStorage.setItem(STORE, JSON.stringify(state));
      stamp("저장됨 · " + new Date().toLocaleTimeString("ko-KR", { hour: "2-digit", minute: "2-digit" }));
    } catch (e) {
      stamp("이 브라우저에 저장할 수 없어 화면에만 남습니다.");
    }
  }
  function stamp(t) { document.getElementById("savedAt").textContent = t; }


  /* ============================ 유틸 ============================ */

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function mean(a) {
    var v = a.filter(function (x) { return x != null; });
    return v.length ? v.reduce(function (p, c) { return p + c; }, 0) / v.length : null;
  }
  function r1(n) { return Math.round(n * 10) / 10; }

  function weekDates() {
    var out = [];
    for (var i = 0; i < 7; i++) out.push(iso(addDays(weekStart, i)));
    return out;
  }
  function col(fn) { return weekDates().map(function (d) { return fn(peek(d), d); }); }

  function series() {
    return {
      dates: weekDates(),
      sleep:   col(function (x) { return sleepHours(x); }),
      sys:     col(function (x) { return x && x.bp ? x.bp.s : null; }),
      dia:     col(function (x) { return x && x.bp ? x.bp.d : null; }),
      glucose: col(function (x) { return x ? x.glucose : null; }),
      weight:  col(function (x) { return x ? x.weight : null; }),
      ex:      col(function (x) { return x && x.exercise ? (x.exercise.min || 0) : null; }),
      water:   col(function (x) { return x ? x.water : null; }),
      mood:    col(function (x) { return x ? x.mood : null; }),
      condition: col(function (x) { return x ? x.condition : null; }),
      overall: col(function (x) { return x ? x.overall : null; })
    };
  }

  // 기록이 있는 날만 이행률의 분모로 센다
  function loggedDays() {
    return weekDates().filter(function (d) {
      var x = peek(d);
      if (!x) return false;
      return sleepHours(x) != null || x.bp || x.glucose != null || x.overall != null ||
        x.condition != null ||
        x.water != null || x.exercise || x.mood != null ||
        x.meals.b || x.meals.l || x.meals.d || medDone(x);
    });
  }

  /* ============================ 요약 타일 ============================ */

  function renderTiles() {
    var s = series();
    var logged = loggedDays();
    var n = logged.length;

    var avgOv = mean(s.overall), avgMood = mean(s.mood), avgSleep = mean(s.sleep);
    var avgCond = mean(s.condition);
    var avgSys = mean(s.sys), avgDia = mean(s.dia);
    var avgGlu = mean(s.glucose), avgWater = mean(s.water);
    // 항목별로 "그 항목을 기록한 날"만 센다. 안 적은 날은 0이 아니라 없는 값이다.
    var exRecorded = s.ex.filter(function (v) { return v != null; }).length;
    var exTotal = s.ex.reduce(function (p, c) { return p + (c || 0); }, 0);
    var exDays = s.ex.filter(function (v) { return v > 0; }).length;

    var mealDays = weekDates().filter(function (d) {
      var x = peek(d);
      return x && (x.meals.b || x.meals.l || x.meals.d);
    });
    var mealsEaten = mealDays.reduce(function (p, d) {
      var m = peek(d).meals;
      return p + (m.b ? 1 : 0) + (m.l ? 1 : 0) + (m.d ? 1 : 0);
    }, 0);
    var mealRate = mealDays.length ? mealsEaten / (mealDays.length * 3) * 100 : null;

    var medsTaken = weekDates().filter(function (d) {
      return medDone(peek(d));      // 끼니별 기록·약 목록 체크·예전 방식을 모두 센다
    }).length;

    var wVals = s.weight.filter(function (v) { return v != null; });
    var wDelta = wVals.length > 1 ? r1(wVals[wVals.length - 1] - wVals[0]) : null;

    var totalItems = 0, doneItems = 0;
    weekDates().forEach(function (d) {
      var x = peek(d);
      if (!x) return;
      totalItems += x.schedule.length;
      doneItems += x.schedule.filter(function (i) { return i.done; }).length;
    });

    var dots = "";
    var lit = avgOv == null ? 0 : Math.round(avgOv);
    for (var i = 1; i <= 5; i++) dots += '<i class="' + (i <= lit ? "on" : "") + '"></i>';

    var html = "";

    html += '<div class="tile hero">' +
      '<span class="label">전체평가 주간 평균</span>' +
      '<span class="value">' + (avgOv == null ? "—" : r1(avgOv).toFixed(1)) + '<span class="unit">/ 5</span></span>' +
      '<div class="dots" role="img" aria-label="5점 중 ' + (avgOv == null ? 0 : r1(avgOv)) + '점">' + dots + "</div>" +
      '<span class="sub">' + n + "일 기록 · 일정 " + doneItems + "/" + totalItems + "건 완료</span>" +
      "</div>";

    html += tile("수면 평균", avgSleep == null ? "—" : r1(avgSleep).toFixed(1), avgSleep == null ? "" : "시간",
      pill(sleepStatus(avgSleep)));
    html += tile("혈압 평균",
      avgSys == null ? "—" : Math.round(avgSys) + "/" + Math.round(avgDia),
      avgSys == null ? "" : "mmHg",
      pill(bpStatus(avgSys == null ? null : Math.round(avgSys), avgDia == null ? null : Math.round(avgDia))));
    html += tile("공복혈당 평균", avgGlu == null ? "—" : Math.round(avgGlu), avgGlu == null ? "" : "mg/dL",
      pill(glucoseStatus(avgGlu == null ? null : Math.round(avgGlu))));
    html += tile("운동 합계", exRecorded ? exTotal : "—", exRecorded ? "분" : "",
      pill(exRecorded ? exerciseStatus(exTotal) : null) +
      (exRecorded ? ' <span class="sub">' + exDays + "일 운동</span>" : ""));
    html += tile("기분 평균", avgMood == null ? "—" : r1(avgMood).toFixed(1), avgMood == null ? "" : "/ 5",
      '<span class="sub">' + moodWord(avgMood) + "</span>");
    html += tile("컨디션 평균", avgCond == null ? "—" : r1(avgCond).toFixed(1), avgCond == null ? "" : "/ 5",
      '<span class="sub">' + condWord(avgCond) + "</span>");
    html += tile("수분 평균", avgWater == null ? "—" : r1(avgWater).toFixed(1), avgWater == null ? "" : "잔",
      pill(waterStatus(avgWater)));
    html += tile("식사 규칙성", mealRate == null ? "—" : Math.round(mealRate), mealRate == null ? "" : "%",
      pill(rateStatus(mealRate)) +
      (mealRate == null ? "" : ' <span class="sub">' + mealsEaten + "/" + (mealDays.length * 3) + "끼</span>"));
    html += tile("복약", medsTaken ? medsTaken : "—", medsTaken ? "일" : "",
      medsTaken
        ? '<span class="pill good"><span class="glyph" aria-hidden="true">●</span>복용한 날</span>'
        : pill(null));
    html += tile("체중 변화",
      wDelta == null ? "—" : (wDelta > 0 ? "+" : "") + wDelta.toFixed(1),
      wDelta == null ? "" : "kg",
      '<span class="sub">' + (wVals.length ? wVals[wVals.length - 1].toFixed(1) + "kg 최근" : "기록 없음") + "</span>");

    document.getElementById("tiles").innerHTML = html;
  }

  function tile(label, value, unit, sub) {
    return '<div class="tile"><span class="label">' + esc(label) + "</span>" +
      '<span class="value">' + esc(value) + (unit ? '<span class="unit">' + esc(unit) + "</span>" : "") + "</span>" +
      '<div class="sub">' + sub + "</div></div>";
  }
  function condWord(v) {
    if (v == null) return "기록 없음";
    if (v >= 4.5) return "아주 좋음";
    if (v >= 3.5) return "가뿐함";
    if (v >= 2.5) return "보통";
    if (v >= 1.5) return "무거움";
    return "많이 힘듦";
  }

  function moodWord(v) {
    if (v == null) return "기록 없음";
    if (v >= 4.5) return "아주 좋음";
    if (v >= 3.5) return "좋음";
    if (v >= 2.5) return "보통";
    if (v >= 1.5) return "가라앉음";
    return "힘듦";
  }

  /* ============================ 일정 ============================ */

  var VIEW_STORE = "weekly-health-ledger-view";
  var view = "cal";
  try {
    if (localStorage.getItem(VIEW_STORE) === "list") view = "list";
  } catch (e) { /* 저장소를 못 읽으면 기본값 */ }

  var TODO_SLOTS = 5;
  /* 날짜별 할 일. 항상 다섯 칸을 보여주고 빈 칸은 그대로 둔다. */
  function todosOf(date) {
    var d = peek(date);
    var t = (d && d.todos) ? d.todos : [];
    var out = [];
    for (var i = 0; i < TODO_SLOTS; i++) {
      out.push(t[i] || { text: "", done: false });
    }
    return out;
  }

  /* 저장용 칸 하나를 꺼낸다. 없으면 그 자리까지 채워 만든다. */
  function todoSlot(date, i) {
    var d = day(date);
    while (d.todos.length <= i) d.todos.push({ text: "", done: false });
    return d.todos[i];
  }

  function schedOf(date) {
    var d = peek(date);
    return d && d.schedule ? d.schedule : [];
  }
  function fromMin(v) {
    v = Math.max(0, Math.min(23 * 60 + 59, Math.round(v)));
    return pad(Math.floor(v / 60)) + ":" + pad(v % 60);
  }
  /* 종료 시각이 없거나 시작보다 이르면 한 시간짜리로 본다 */
  function endMin(it) {
    var s = toMin(it.time);
    if (s == null) return null;
    var e = toMin(it.end);
    if (e == null || e <= s) e = Math.min(24 * 60, s + 60);
    return e;
  }
  function findItem(date, id) {
    var list = schedOf(date);
    for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i];
    return null;
  }

  function renderLedger() {
    var host = document.getElementById("ledger");
    host.className = view === "cal" ? "cal" : "ledger";
    host.innerHTML = view === "cal" ? calMarkup() : listMarkup();
    if (view === "cal") {
      var body = host.querySelector(".cal-body");
      if (body) body.scrollTop = calScroll;
    }
  }

  /* ---------- 캘린더 ---------- */

  var calScroll = 0;

  /* 기본 08–21시를 두되, 그 밖의 일정이 있으면 그만큼 넓힌다 */
  function calRange() {
    var lo = 8 * 60, hi = 21 * 60;
    weekDates().forEach(function (date) {
      schedOf(date).forEach(function (it) {
        var s = toMin(it.time);
        if (s == null) return;
        lo = Math.min(lo, s);
        hi = Math.max(hi, endMin(it));
      });
    });
    lo = Math.floor(lo / 60) * 60;
    hi = Math.ceil(hi / 60) * 60;
    return { lo: lo, hi: Math.min(24 * 60, Math.max(hi, lo + 60)) };
  }

  /* 겹치는 일정끼리 묶어 가로로 나눠 놓는다 */
  function packDay(items) {
    var timed = items.filter(function (it) { return toMin(it.time) != null; })
      .sort(function (a, b) { return toMin(a.time) - toMin(b.time) || endMin(a) - endMin(b); });

    var out = [], group = [], groupEnd = -1;

    function flush() {
      if (!group.length) return;
      var colEnds = [];
      var placed = group.map(function (it) {
        var s = toMin(it.time), e = endMin(it), c = 0;
        while (c < colEnds.length && colEnds[c] > s) c++;
        colEnds[c] = e;
        return { it: it, col: c };
      });
      placed.forEach(function (p) { p.of = colEnds.length; out.push(p); });
      group = []; groupEnd = -1;
    }

    timed.forEach(function (it) {
      if (group.length && toMin(it.time) >= groupEnd) flush();
      group.push(it);
      groupEnd = Math.max(groupEnd, endMin(it));
    });
    flush();
    return out;
  }

  function evBlock(it, chip) {
    if (chip) return '<span class="n">' + esc(it.title) + "</span>";
    return '<span class="t">' + esc(it.time + "–" + fromMin(endMin(it))) + "</span>" +
      '<span class="n">' + esc(it.title) + "</span>";
  }

  function evHTML(date, it, opts) {
    var cls = "ev" + (it.done ? " done" : "") + (opts.chip ? " chip" : "") +
      (opts.short ? " short" : "") + (opts.tight ? " tight" : "");
    var full = opts.chip
      ? "Event · " + it.title
      : it.time + "–" + fromMin(endMin(it)) + " " + it.title;
    return '<div class="' + cls + '" title="' + esc(full) + '"' +
      (opts.style ? ' style="' + opts.style + '"' : "") + ">" +
      '<input class="tick" type="checkbox"' + (it.done ? " checked" : "") +
      ' data-toggle="' + esc(date) + '|' + esc(it.id) + '"' +
      ' aria-label="' + esc(it.title) + ' 완료">' +
      '<span class="txt">' + evBlock(it, opts.chip) + "</span>" +
      '<button class="del" data-del="' + esc(date) + '|' + esc(it.id) + '"' +
      ' aria-label="' + esc(it.title) + ' 삭제">×</button>' +
      "</div>";
  }

  function calMarkup() {
    var r = calRange(), dates = weekDates();
    var nowMin = new Date().getHours() * 60 + new Date().getMinutes();

    var head = '<div class="cal-head"><div></div>' + dates.map(function (date, i) {
      var dd = parseISO(date);
      return '<div class="cal-dh' + (date === TODAY ? " is-today" : "") +
        (i >= 5 ? " is-weekend" : "") + '">' +
        '<span class="dow">' + DOW[i] + "</span>" +
        '<span class="dnum">' + dd.getDate() + "</span></div>";
    }).join("") + "</div>";

    var allday = '<div class="cal-allday"><div class="cal-adlabel">Event</div>' +
      dates.map(function (date) {
        return '<div class="cal-ad">' + schedOf(date)
          .filter(function (it) { return toMin(it.time) == null; })
          .map(function (it) { return evHTML(date, it, { chip: true }); })
          .join("") +
          '<input type="text" class="ad-in" data-adnew="' + date + '" placeholder="·"' +
          ' aria-label="' + esc(date) + ' 시간 없는 일정 추가">' +
          "</div>";
      }).join("") + "</div>";

    var todoRow = '<div class="cal-todo"><div class="cal-adlabel">Todo</div>' +
      dates.map(function (date) {
        return '<div class="cal-td">' + todosOf(date).map(function (t, i) {
          return '<div class="td-row' + (t.done ? " done" : "") + '">' +
            '<input type="checkbox" data-todo="' + date + '|' + i + '"' +
              (t.done ? " checked" : "") + ' aria-label="' + esc(date) + " 할 일 " + (i + 1) + '">' +
            '<input type="text" class="td-in" data-todotext="' + date + '|' + i + '"' +
              ' value="' + esc(t.text) + '" placeholder="·" aria-label="' + esc(date) + " 할 일 " + (i + 1) + ' 내용">' +
          "</div>";
        }).join("") + "</div>";
      }).join("") + "</div>";

    var gutter = '<div class="cal-gutter">';
    for (var m = r.lo; m < r.hi; m += 60) {
      gutter += '<div class="cal-hr">' + (m === r.lo ? "" : fromMin(m)) + "</div>";
    }
    gutter += "</div>";

    var cols = dates.map(function (date) {
      var blocks = packDay(schedOf(date)).map(function (p) {
        var s = toMin(p.it.time), e = endMin(p.it);
        var top = (s - r.lo) / 60, height = (e - s) / 60;
        var style = "top:calc(" + top + " * var(--hh));" +
          "height:calc(" + height + " * var(--hh) - 2px);" +
          "left:calc(" + (p.col * 100 / p.of) + "% + 2px);" +
          "width:calc(" + (100 / p.of) + "% - 4px)";
        return evHTML(date, p.it, {
          style: style, short: e - s <= 60, tight: p.of > 1
        });
      }).join("");

      var now = date === TODAY && nowMin >= r.lo && nowMin <= r.hi
        ? '<div class="nowline" style="top:calc(' + ((nowMin - r.lo) / 60) +
          ' * var(--hh))" aria-hidden="true"></div>'
        : "";

      return '<div class="cal-col is-open' + (date === TODAY ? " is-today" : "") +
        '" data-slot="' + date + '" style="height:calc(' + ((r.hi - r.lo) / 60) +
        ' * var(--hh))">' + blocks + now + "</div>";
    }).join("");

    var opts = dates.map(function (date, i) {
      var dd = parseISO(date);
      return '<option value="' + date + '"' + (date === selected ? " selected" : "") + ">" +
        DOW[i] + " " + (dd.getMonth() + 1) + "/" + dd.getDate() + "</option>";
    }).join("");

    var add = '<div class="cal-add">' +
      '<select id="addDay" aria-label="날짜">' + opts + "</select>" +
      '<input class="time" id="addStart" type="text" inputmode="numeric" maxlength="5" placeholder="09:00" aria-label="시작 시간">' +
      '<span class="dash" aria-hidden="true">–</span>' +
      '<input class="time" id="addEnd" type="text" inputmode="numeric" maxlength="5" placeholder="10:00" aria-label="종료 시간">' +
      '<input class="title" id="addTitle" type="text" placeholder="일정 내용" aria-label="일정 내용">' +
      '<button type="button" id="addBtn">추가</button>' +
      "</div>";

    return '<div class="cal-scroll"><div class="cal-inner">' + head + allday + todoRow +
      '<div class="cal-body">' + gutter + cols + "</div></div></div>" + add;
  }

  /* ---------- 목록 ---------- */

  function listMarkup() {
    return weekDates().map(function (date, i) {
      var d = peek(date);
      var items = d && d.schedule.length
        ? d.schedule.slice().sort(function (a, b) { return a.time.localeCompare(b.time); })
        : [];
      var cls = "day-row" + (date === TODAY ? " is-today" : "") + (i >= 5 ? " is-weekend" : "");
      var dd = parseISO(date);

      var rows = items.length
        ? items.map(function (it) {
            var key = date + "|" + it.id;
            var e = endMin(it);
            var at = e == null ? it.time : it.time + "–" + fromMin(e);
            return '<div class="item' + (it.done ? " done" : "") + '">' +
              '<input class="tick" type="checkbox"' + (it.done ? " checked" : "") +
              ' data-toggle="' + esc(key) + '" aria-label="' + esc(it.title) + ' 완료">' +
              '<span class="at">' + esc(at) + "</span>" +
              '<span class="what">' + esc(it.title) + "</span>" +
              '<button class="del" data-del="' + esc(key) + '" aria-label="' + esc(it.title) + ' 삭제">×</button>' +
              "</div>";
          }).join("")
        : '<p class="empty">비어 있는 날</p>';

      return '<div class="' + cls + '">' +
        '<div class="daystamp"><span class="dow">' + DOW[i] + "</span>" +
        '<span class="date">' + (dd.getMonth() + 1) + "/" + dd.getDate() + "</span>" +
        (date === TODAY ? '<span class="today-mark">TODAY</span>' : "") + "</div>" +
        '<div class="items">' + rows +
        '<div class="add-row">' +
        '<input class="time" type="text" inputmode="numeric" placeholder="09:00" maxlength="5" data-t="' + date + '" aria-label="시간">' +
        '<input class="title" type="text" placeholder="일정 추가" data-n="' + date + '" aria-label="일정 내용">' +
        '<button data-add="' + date + '">추가</button>' +
        "</div></div></div>";
    }).join("");
  }



  /* ============================ 차트 ============================ */

  /* 건강 추이는 일곱 항목을 한 줄에 나란히 두는 작은 차트다.
     좁은 폭에서 눈금 글자가 뭉치므로 축 글자를 빼고 값은 제목 옆에 적는다. */
  var COMPACT = true;
  var W = 320, H = 128, PL = 32, PR = 14, PT = 12, PB = 22;
  var IW = W - PL - PR, IH = H - PT - PB;

  function xAt(i) { return PL + i * IW / 6; }
  function bandAt(i) { return { x: PL + i * IW / 7, w: IW / 7 }; }

  function niceDomain(vals, opts) {
    opts = opts || {};
    var v = vals.filter(function (x) { return x != null; });
    if (!v.length) return [0, 1];
    var lo = Math.min.apply(null, v), hi = Math.max.apply(null, v);
    if (opts.fromZero) lo = 0;
    if (lo === hi) { lo -= 1; hi += 1; }
    var padv = (hi - lo) * 0.2;
    lo -= padv; hi += padv;
    if (opts.fromZero) lo = 0;
    if (opts.floor != null) lo = Math.max(opts.floor, lo);
    var span = hi - lo;
    var step = Math.pow(10, Math.floor(Math.log(span) / Math.LN10)) / 2;
    if (step <= 0) step = 1;
    lo = Math.floor(lo / step) * step;
    hi = Math.ceil(hi / step) * step;
    return [lo, hi];
  }

  function fmtNum(v) {
    return (Math.round(v * 10) % 10 === 0) ? String(Math.round(v)) : v.toFixed(1);
  }

  function axes(cfg, y, lo, hi, banded) {
    var g = "";
    if (COMPACT) {
      /* 위 눈금선 하나와 밑변만 — 숫자와 요일은 제목·풍선에서 읽는다 */
      g += '<line x1="' + PL + '" x2="' + (W - PR) + '" y1="' + y(hi).toFixed(1) +
        '" y2="' + y(hi).toFixed(1) +
        '" stroke="var(--grid)" stroke-width="1" vector-effect="non-scaling-stroke"/>' +
        '<line x1="' + PL + '" x2="' + (W - PR) + '" y1="' + (PT + IH) + '" y2="' + (PT + IH) +
        '" stroke="var(--baseline)" stroke-width="1" vector-effect="non-scaling-stroke"/>';
      return g;
    }
    var ticks = cfg.ticks || [lo, (lo + hi) / 2, hi];
    ticks.forEach(function (t) {
      var yy = y(t).toFixed(1);
      g += '<line x1="' + PL + '" x2="' + (W - PR) + '" y1="' + yy + '" y2="' + yy +
        '" stroke="var(--grid)" stroke-width="1" vector-effect="non-scaling-stroke"/>' +
        '<text x="' + (PL - 6) + '" y="' + (y(t) + 3.2).toFixed(1) + '" text-anchor="end" ' +
        'font-family="var(--mono)" font-size="8.5" fill="var(--muted)">' + esc(fmtNum(t)) + "</text>";
    });
    g += '<line x1="' + PL + '" x2="' + (W - PR) + '" y1="' + (PT + IH) + '" y2="' + (PT + IH) +
      '" stroke="var(--baseline)" stroke-width="1" vector-effect="non-scaling-stroke"/>';
    DOW.forEach(function (d, i) {
      var cx = banded ? bandAt(i).x + bandAt(i).w / 2 : xAt(i);
      g += '<text x="' + cx.toFixed(1) + '" y="' + (H - 6) + '" text-anchor="middle" ' +
        'font-family="var(--sans)" font-size="9" fill="var(--muted)">' + d + "</text>";
    });
    return g;
  }

  function hitRects() {
    var h = "";
    for (var i = 0; i < 7; i++) {
      var b = bandAt(i);
      h += '<rect class="hit" data-i="' + i + '" x="' + b.x.toFixed(1) + '" y="' + PT +
        '" width="' + b.w.toFixed(1) + '" height="' + IH + '" fill="transparent"/>';
    }
    return h;
  }

  // 한 행을 통째로 쓰는 차트는 더 넓은 좌표계로 그린다 (글자·선 왜곡 없이)
  function useWidth(cfg) {
    if (COMPACT) {
      W = 150; H = 74; PL = 5; PR = 5; PT = 9; PB = 5;
    } else {
      W = cfg.w || 320; H = 128; PL = 32; PR = 14; PT = 12; PB = 22;
    }
    IW = W - PL - PR;
    IH = H - PT - PB;
  }

  function makeSvg(cfg) {
    useWidth(cfg);

    // 값이 하나도 없으면 눈금 대신 안내를 보여준다 (0~1 같은 엉뚱한 축을 피함)
    var hasAny = cfg.series.some(function (s) {
      return s.values.some(function (v) { return v != null; });
    });
    if (!hasAny) {
      return '<svg viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="' +
        esc(cfg.aria) + ' — 기록 없음">' +
        '<line x1="' + PL + '" x2="' + (W - PR) + '" y1="' + (PT + IH) + '" y2="' + (PT + IH) +
        '" stroke="var(--grid)" stroke-width="1" vector-effect="non-scaling-stroke"/>' +
        '<text x="' + (W / 2) + '" y="' + (PT + IH / 2 + 3) + '" text-anchor="middle" ' +
        'font-family="var(--sans)" font-size="10" fill="var(--muted)">아직 기록이 없습니다</text>' +
        "</svg>";
    }

    var banded = cfg.kind !== "line";
    var dom = cfg.domain || niceDomain(
      cfg.series.reduce(function (a, s) { return a.concat(s.values); }, []), cfg.domainOpts);
    var lo = dom[0], hi = dom[1];
    var y = function (v) { return PT + IH - (v - lo) / (hi - lo) * IH; };

    var body = axes(cfg, y, lo, hi, banded);
    var cross = cfg.kind === "line"
      ? '<line class="cross" x1="0" x2="0" y1="' + PT + '" y2="' + (PT + IH) +
        '" stroke="var(--baseline)" stroke-width="1" stroke-dasharray="2 3" vector-effect="non-scaling-stroke" opacity="0"/>'
      : "";
    var marks = "";

    if (cfg.kind === "line") {
      cfg.series.forEach(function (s) {
        var pts = [];
        s.values.forEach(function (v, i) { if (v != null) pts.push([xAt(i), y(v), i, v]); });
        if (!pts.length) return;
        var path = pts.map(function (p, k) {
          return (k ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1);
        }).join(" ");
        if (cfg.area && pts.length > 1) {
          marks += '<path d="' + path + " L" + pts[pts.length - 1][0].toFixed(1) + " " + (PT + IH) +
            " L" + pts[0][0].toFixed(1) + " " + (PT + IH) + ' Z" fill="' + s.color + '" opacity=".13"/>';
        }
        marks += '<path d="' + path + '" fill="none" stroke="' + s.color +
          '" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>';
        pts.forEach(function (p, k) {
          var last = k === pts.length - 1;
          var r = COMPACT ? (last ? 2.6 : 0) : (last ? 4.5 : 3.2);
          if (!r) return;
          marks += '<circle cx="' + p[0].toFixed(1) + '" cy="' + p[1].toFixed(1) + '" r="' + r +
            '" fill="' + s.color + '" stroke="var(--surface)" stroke-width="' + (COMPACT ? 1.4 : 2) + '"/>';
        });
        // 마지막 값만 직접 표기 — 모든 점에 숫자를 얹지 않는다.
        // 컴팩트에서는 제목 옆에 크게 적으므로 그림 안에는 넣지 않는다.
        if (COMPACT) return;
        var lp = pts[pts.length - 1];
        var up = lp[1] > PT + 18;
        marks += '<text x="' + (lp[0] - 7).toFixed(1) + '" y="' + (up ? lp[1] - 8 : lp[1] + 13).toFixed(1) +
          '" text-anchor="end" font-family="var(--mono)" font-size="9.5" font-weight="600" ' +
          'fill="var(--ink-2)">' + esc(cfg.valueFmt(lp[3])) + "</text>";
      });
    } else if (cfg.kind === "grouped") {
      for (var i = 0; i < 7; i++) {
        var b = bandAt(i);
        var n = cfg.series.length;
        var bw = Math.min(26, (b.w - 10 - (n - 1) * 2) / n); // 넓은 칸에서도 막대가 두꺼워지지 않게
        var gx = b.x + (b.w - (bw * n + (n - 1) * 2)) / 2;
        cfg.series.forEach(function (s, k) {
          var bx = gx + k * (bw + 2);          // 막대 사이 2px 여백
          marks += '<rect x="' + bx.toFixed(1) + '" y="' + y(hi).toFixed(1) + '" width="' + bw.toFixed(1) +
            '" height="' + (PT + IH - y(hi)).toFixed(1) + '" rx="3" fill="var(--grid)"/>';
          var v = s.values[i];
          if (v == null || v <= 0) return;
          marks += '<rect x="' + bx.toFixed(1) + '" y="' + y(v).toFixed(1) + '" width="' + bw.toFixed(1) +
            '" height="' + (PT + IH - y(v)).toFixed(1) + '" rx="3" fill="' + s.color + '"/>' +
            '<rect x="' + bx.toFixed(1) + '" y="' + (PT + IH - 3) + '" width="' + bw.toFixed(1) +
            '" height="3" fill="' + s.color + '"/>';   // 밑변은 각지게
        });
      }
    } else { // bar
      cfg.series.forEach(function (s) {
        s.values.forEach(function (v, i) {
          var b = bandAt(i);
          var bw = Math.max(6, b.w - 8);
          var bx = b.x + (b.w - bw) / 2;
          if (v == null || v <= 0) return;
          var h = PT + IH - y(v);
          if (h < 1.5) return;
          marks += '<rect x="' + bx.toFixed(1) + '" y="' + y(v).toFixed(1) + '" width="' + bw.toFixed(1) +
            '" height="' + h.toFixed(1) + '" rx="4" fill="' + s.color + '"/>' +
            '<rect x="' + bx.toFixed(1) + '" y="' + (PT + IH - 4) + '" width="' + bw.toFixed(1) +
            '" height="4" fill="' + s.color + '"/>';
        });
      });
    }

    return '<svg viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="' + esc(cfg.aria) + '">' +
      body + cross + marks + hitRects() + "</svg>";
  }

  /* 계열의 마지막 기록값 */
  function lastVal(vals) {
    for (var i = vals.length - 1; i >= 0; i--) if (vals[i] != null) return vals[i];
    return null;
  }

  function chartBlock(cfg) {
    var legend = cfg.series.length > 1
      ? '<span class="legend">' + cfg.series.map(function (s) {
          return '<span><i style="background:' + s.color + '"></i>' + esc(s.name) + "</span>";
        }).join("") + "</span>"
      : "";

    if (COMPACT) {
      var lv = cfg.latestFmt ? cfg.latestFmt() : (function () {
        var v = lastVal(cfg.series[0].values);
        return v == null ? "—" : cfg.valueFmt(v);
      })();
      return '<div class="chart-block">' +
        '<div class="chart-head"><h3>' + esc(cfg.title) + "</h3></div>" +
        '<div class="chart-latest">' + esc(lv) +
        '<span class="cunit">' + esc(cfg.scale) + "</span></div>" +
        '<div class="plot" data-chart="' + esc(cfg.id) + '">' + makeSvg(cfg) +
        '<div class="tip" role="status"></div></div>' +
        legend +
      "</div>";
    }

    return '<div class="chart-block">' +
      '<div class="chart-head"><h3>' + esc(cfg.title) + "</h3>" +
      '<span class="scale">' + esc(cfg.scale) + "</span>" + legend + "</div>" +
      '<div class="plot" data-chart="' + esc(cfg.id) + '">' + makeSvg(cfg) +
      '<div class="tip" role="status"></div></div></div>';
  }

  var chartDefs = [];

  function renderCharts() {
    var s = series();
    var S1 = "var(--s1)", S2 = "var(--s2)", S3 = "var(--s3)";
    var one = function (v) { return String(v); };

    chartDefs = [
      { id: "sleep", title: "수면 시간", scale: "시간", aria: "요일별 수면 시간", kind: "line", area: true,
        series: [{ name: "수면", color: S1, values: s.sleep }],
        domain: [3, 10], ticks: [4, 7, 10],
        valueFmt: function (v) { return r1(v).toFixed(1); },
        tipFmt: function (i) {
          if (s.sleep[i] == null) return null;
          var rg = sleepRange(peek(s.dates[i]));
          var rows = [{ color: S1, name: "수면", text: fmtDur(s.sleep[i]) }];
          if (rg) rows.push({ plain: rg });
          rows.push({ plain: sleepStatus(s.sleep[i]).label });
          return rows;
        } },

      { id: "bp", title: "혈압", scale: "MMHG", aria: "요일별 수축기·이완기 혈압", kind: "line",
        series: [{ name: "수축기", color: S1, values: s.sys }, { name: "이완기", color: S2, values: s.dia }],
        domain: [50, 160], ticks: [60, 90, 120, 150],
        valueFmt: one,
        latestFmt: function () {
          var a = lastVal(s.sys), b = lastVal(s.dia);
          return (a == null || b == null) ? "—" : a + "/" + b;
        },
        tipFmt: function (i) {
          if (s.sys[i] == null) return null;
          return [{ color: S1, name: "수축기", text: s.sys[i] + " mmHg" },
                  { color: S2, name: "이완기", text: s.dia[i] + " mmHg" },
                  { plain: bpStatus(s.sys[i], s.dia[i]).label }];
        } },

      { id: "glucose", title: "공복혈당", scale: "MG/DL", aria: "요일별 공복혈당", kind: "line", area: true,
        series: [{ name: "공복혈당", color: S1, values: s.glucose }],
        domainOpts: { floor: 60 },
        valueFmt: one,
        tipFmt: function (i) {
          if (s.glucose[i] == null) return null;
          return [{ color: S1, name: "공복혈당", text: s.glucose[i] + " mg/dL" },
                  { plain: glucoseStatus(s.glucose[i]).label }];
        } },

      { id: "weight", title: "체중", scale: "KG", aria: "요일별 체중", kind: "line",
        series: [{ name: "체중", color: S1, values: s.weight }],
        valueFmt: function (v) { return r1(v).toFixed(1); },
        tipFmt: function (i) {
          if (s.weight[i] == null) return null;
          return [{ color: S1, name: "체중", text: r1(s.weight[i]).toFixed(1) + " kg" }];
        } },

      { id: "exercise", title: "운동 시간", scale: "분", aria: "요일별 운동 시간", kind: "bar",
        series: [{ name: "운동", color: S1, values: s.ex }],
        domainOpts: { fromZero: true },
        valueFmt: one,
        tipFmt: function (i) {
          var d = peek(s.dates[i]);
          if (!d || !d.exercise) return null;
          return [{ color: S1, name: "운동",
                    text: (d.exercise.min || 0) + "분" + (d.exercise.kind ? " · " + d.exercise.kind : "") }];
        } },

      { id: "water", title: "물 섭취", scale: "잔", aria: "요일별 물 섭취량", kind: "bar",
        series: [{ name: "물", color: S1, values: s.water }],
        domain: [0, 10], ticks: [0, 5, 10],
        valueFmt: one,
        tipFmt: function (i) {
          if (s.water[i] == null) return null;
          return [{ color: S1, name: "물", text: s.water[i] + "잔" }];
        } },

      { id: "mood", title: "기분 · 컨디션 · 전체평가", scale: "5점 척도",
        aria: "요일별 기분, 컨디션, 전체평가",
        // 좁은 칸에서 막대 21개는 뭉쳐 보이므로 선으로 그린다
        kind: COMPACT ? "line" : "grouped", w: 700,
        series: [{ name: "기분", color: S1, values: s.mood },
                 { name: "컨디션", color: S3, values: s.condition },
                 { name: "전체평가", color: S2, values: s.overall }],
        domain: [0, 5], ticks: [0, 5],
        valueFmt: one,
        latestFmt: function () {
          var m = lastVal(s.mood), c = lastVal(s.condition), v = lastVal(s.overall);
          var f = function (x) { return x == null ? "–" : x; };
          return (m == null && c == null && v == null) ? "—" : f(m) + "·" + f(c) + "·" + f(v);
        },
        tipFmt: function (i) {
          if (s.mood[i] == null && s.condition[i] == null && s.overall[i] == null) return null;
          return [{ color: S1, name: "기분", text: s.mood[i] == null ? "—" : s.mood[i] + " / 5" },
                  { color: S3, name: "컨디션", text: s.condition[i] == null ? "—" : s.condition[i] + " / 5" },
                  { color: S2, name: "전체평가", text: s.overall[i] == null ? "—" : s.overall[i] + " / 5" }];
        } }
    ];

    document.getElementById("charts").innerHTML = chartDefs.map(chartBlock).join("");
    chartDefs.forEach(bindHover);
    renderTable(s);
  }

  // 그 주에 남긴 증상·메모를 한자리에 모아 본다

  function bindHover(cfg) {
    var plot = document.querySelector('.plot[data-chart="' + cfg.id + '"]');
    if (!plot) return;
    var svg = plot.querySelector("svg");
    var tip = plot.querySelector(".tip");
    var cross = svg.querySelector(".cross");
    var dates = weekDates();

    Array.prototype.forEach.call(plot.querySelectorAll(".hit"), function (hit) {
      var i = +hit.getAttribute("data-i");
      hit.addEventListener("mouseenter", function () { show(i); });
      hit.addEventListener("mousemove", function () { show(i); });
    });
    svg.addEventListener("mouseleave", hide);

    function show(i) {
      useWidth(cfg);
      var rows = cfg.tipFmt(i);
      var dd = parseISO(dates[i]);
      var head = "<b>" + DOW[i] + " · " + (dd.getMonth() + 1) + "/" + dd.getDate() + "</b>";
      tip.innerHTML = head + (rows
        ? rows.map(function (r) {
            if (r.plain) return '<div class="row">' + esc(r.plain) + "</div>";
            return '<div class="row"><i style="background:' + r.color + '"></i>' +
              esc(r.name) + " " + esc(r.text) + "</div>";
          }).join("")
        : '<div class="row">기록 없음</div>');

      var box = svg.getBoundingClientRect();
      var scale = box.width / W;
      var cx = cfg.kind === "line" ? xAt(i) : bandAt(i).x + bandAt(i).w / 2;
      tip.style.left = (cx * scale) + "px";
      tip.style.top = (PT * scale - 6) + "px";
      tip.classList.add("show");
      if (cross) {
        cross.setAttribute("x1", cx.toFixed(1));
        cross.setAttribute("x2", cx.toFixed(1));
        cross.setAttribute("opacity", "1");
      }
    }
    function hide() {
      tip.classList.remove("show");
      if (cross) cross.setAttribute("opacity", "0");
    }
  }

  /* ============================ 표 ============================ */

  function renderTable(s) {
    var heads = s.dates.map(function (d, i) {
      var dd = parseISO(d);
      return "<th>" + DOW[i] + "<br>" + (dd.getMonth() + 1) + "/" + dd.getDate() + "</th>";
    }).join("");

    function row(label, vals) {
      return '<tr><th scope="row">' + esc(label) + "</th>" + vals.map(function (v) {
        return "<td>" + (v == null || v === "" ? "—" : esc(v)) + "</td>";
      }).join("") + "</tr>";
    }

    var bpVals = s.dates.map(function (d) { var x = peek(d); return x && x.bp ? x.bp.s + "/" + x.bp.d : null; });
    var exVals = s.dates.map(function (d) {
      var x = peek(d);
      if (!x || !x.exercise || !x.exercise.min) return null;
      return x.exercise.min + "분" + (x.exercise.kind ? " " + x.exercise.kind : "");
    });
    var mealVals = s.dates.map(function (d) {
      var x = peek(d);
      if (!x) return null;
      var on = MEALS.filter(function (m) { return x.meals[m[0]]; }).map(function (m) { return m[1]; });
      return on.length ? on.join("·") : null;
    });
    var medVals = s.dates.map(function (d) {
      var x = peek(d);
      if (!x) return null;
      var pm = pillMeals(x);
      if (pm.length) {
        return pm.map(function (m) { return m[1] + " " + pillOf(x, m[0]); }).join(" · ");
      }
      if (!medList().length) return x.meds ? "복용" : "—";
      var taken = medList().filter(function (m) { return x.medTaken && x.medTaken[m.id]; });
      if (!taken.length) return x.meds ? "복용" : "—";
      return taken.length + "/" + medList().length + " " + taken.map(function (m) { return m.name; }).join("·");
    });
    var schedVals = s.dates.map(function (d) {
      var x = peek(d);
      if (!x || !x.schedule.length) return null;
      return x.schedule.filter(function (i) { return i.done; }).length + "/" + x.schedule.length;
    });

    document.getElementById("tableHost").innerHTML =
      "<table><caption>같은 데이터를 표로 — 값을 그대로 읽거나 옮겨 적을 때 씁니다.</caption>" +
      "<thead><tr><th>항목</th>" + heads + "</tr></thead><tbody>" +
      row("수면 (시간)", s.sleep.map(function (v) { return v == null ? null : r1(v).toFixed(1); })) +
      row("취침 – 기상", s.dates.map(function (d) { return sleepRange(peek(d)); })) +
      row("혈압 (mmHg)", bpVals) +
      row("공복혈당 (mg/dL)", s.glucose) +
      row("체중 (kg)", s.weight.map(function (v) { return v == null ? null : r1(v).toFixed(1); })) +
      row("운동", exVals) +
      row("물 (잔)", s.water) +
      row("식사", mealVals) +
      MEALS.map(function (m) {
        var vals = s.dates.map(function (d) { return menuOf(peek(d), m[0]) || null; });
        /* 아무도 적지 않은 끼니는 빈 줄을 만들지 않는다 */
        return vals.some(function (v) { return v; }) ? row(m[1] + " 식단", vals) : "";
      }).join("") +
      row("복약", medVals) +
      row("기분 (/5)", s.mood) +
      row("컨디션 (/5)", s.condition) +
      row("전체평가 (/5)", s.overall) +
      row("일정 완료", schedVals) +
      "</tbody></table>";
  }

  /* ============================ 하루 기록 ============================ */

  function renderTabs() {
    var dates = weekDates();
    if (dates.indexOf(selected) === -1) selected = dates[0];
    document.getElementById("dayTabs").innerHTML = dates.map(function (d, i) {
      var dd = parseISO(d);
      return '<button role="tab" aria-selected="' + (d === selected) + '" data-tab="' + d + '">' +
        '<span class="d">' + DOW[i] + "</span>" +
        '<span class="n">' + (dd.getMonth() + 1) + "/" + dd.getDate() + "</span></button>";
    }).join("");
  }

  /* 시각 입력 한 줄 — 오전/오후, 시, 분(5분 단위)을 고른다.
     내부 저장은 "HH:MM" 24시간 형식 그대로라 계산 로직은 손대지 않는다. */
  var SLEEP_STEP = 5;

  function timeRow(label, id, value) {
    var m = /^(\d{1,2}):(\d{2})$/.exec(value || "");
    var h24 = m ? +m[1] : null;
    var min = m ? +m[2] : null;
    var isPm = h24 != null && h24 >= 12;
    var h12 = h24 == null ? null : (h24 % 12 === 0 ? 12 : h24 % 12);
    // 5분 단위가 아닌 기존 값은 가장 가까운 눈금으로 맞춰 보여준다
    var minSnap = min == null ? null : Math.min(55, Math.round(min / SLEEP_STEP) * SLEEP_STEP);

    var ap = '<select id="' + id + 'Ap" aria-label="' + esc(label) + ' 오전/오후">' +
      '<option value=""' + (h24 == null ? " selected" : "") + ">--</option>" +
      '<option value="am"' + (h24 != null && !isPm ? " selected" : "") + ">오전</option>" +
      '<option value="pm"' + (isPm ? " selected" : "") + ">오후</option>" +
      "</select>";

    var hh = '<select id="' + id + 'H" aria-label="' + esc(label) + ' 시">' +
      '<option value=""' + (h12 == null ? " selected" : "") + ">--</option>";
    for (var i = 1; i <= 12; i++) {
      hh += '<option value="' + i + '"' + (h12 === i ? " selected" : "") + ">" + i + "</option>";
    }
    hh += "</select>";

    var mm = '<select id="' + id + 'M" aria-label="' + esc(label) + ' 분">' +
      '<option value=""' + (minSnap == null ? " selected" : "") + ">--</option>";
    for (var k = 0; k < 60; k += SLEEP_STEP) {
      mm += '<option value="' + k + '"' + (minSnap === k ? " selected" : "") + ">" + pad(k) + "</option>";
    }
    mm += "</select>";

    return '<div class="timerow">' +
      '<span class="tlabel">' + esc(label) + "</span>" +
      ap + hh + '<span class="tunit">시</span>' + mm + '<span class="tunit">분</span>' +
      "</div>";
  }

  function bpNoteHtml(s, d) {
    return (s != null && d != null) ? pill(bpStatus(s, d)) : "수축기 / 이완기";
  }

  function sleepNoteHtml(h) {
    return h != null
      ? pill(sleepStatus(h)) + " " + esc(fmtDur(h))
      : "그날 아침 일어난 잠을 적습니다";
  }

  function readTimeRow(host, id) {
    var ap = host.querySelector("#" + id + "Ap");
    var hh = host.querySelector("#" + id + "H");
    var mm = host.querySelector("#" + id + "M");
    if (!ap || !hh || !mm) return "";
    if (!ap.value || !hh.value || mm.value === "") return "";
    var h = +hh.value % 12;                 // 12시는 0시로 환산
    if (ap.value === "pm") h += 12;         // 오후는 12시간을 더한다
    return pad(h) + ":" + pad(+mm.value);
  }

  function rateBtns(cur) {
    var out = "";
    for (var i = 1; i <= 5; i++) {
      out += '<button type="button" aria-pressed="' + (cur === i) + '" data-v="' + i + '">' + i + "</button>";
    }
    return out;
  }

  function renderForm() {
    var d = day(selected);
    var bp = d.bp || {};
    var ex = d.exercise || {};
    var sl = (d.sleep && typeof d.sleep === "object") ? d.sleep : {};
    var sf = sl.from || "", st = sl.to || "";
    var sh = sleepHours(d);
    var host = document.getElementById("entryForm");

    host.innerHTML =
      '<div class="field span-2">' +
        '<span class="flabel">수면 · 취침 ~ 기상</span>' +
        timeRow("취침", "sleepFrom", sf) +
        timeRow("기상", "sleepTo", st) +
        '<span class="note" id="sleepNote">' + sleepNoteHtml(sh) + "</span>" +
      "</div>" +

      '<div class="field">' +
        '<span class="flabel">혈압 · mmHg</span>' +
        '<div class="pair">' +
          '<input type="number" id="bpS" min="60" max="250" step="1" value="' + (bp.s == null ? "" : bp.s) + '" aria-label="수축기 혈압">' +
          '<span class="sep">/</span>' +
          '<input type="number" id="bpD" min="30" max="150" step="1" value="' + (bp.d == null ? "" : bp.d) + '" aria-label="이완기 혈압">' +
        "</div>" +
        '<span class="note" id="bpNote">' + bpNoteHtml(bp.s, bp.d) + "</span>" +
      "</div>" +

      '<div class="field">' +
        '<label for="glu">공복혈당 · mg/dL</label>' +
        '<input type="number" id="glu" min="30" max="500" step="1" value="' + (d.glucose == null ? "" : d.glucose) + '">' +
        '<span class="note">' + (d.glucose != null ? pill(glucoseStatus(d.glucose)) : "아침 공복 기준") + "</span>" +
      "</div>" +

      '<div class="field">' +
        '<label for="weight">체중 · kg</label>' +
        '<input type="number" id="weight" min="20" max="250" step="0.1" value="' + (d.weight == null ? "" : d.weight) + '">' +
        '<span class="note">같은 시간에 재면 흐름이 또렷해집니다</span>' +
      "</div>" +

      '<div class="field">' +
        '<label for="exMin">운동 · 분</label>' +
        '<input type="number" id="exMin" min="0" max="600" step="5" value="' + (ex.min == null ? "" : ex.min) + '">' +
        '<input type="text" id="exKind" placeholder="종목 (달리기, 요가…)" value="' + esc(ex.kind || "") + '" aria-label="운동 종목">' +
      "</div>" +

      '<div class="field">' +
        '<label for="water">물 · 잔</label>' +
        '<input type="number" id="water" min="0" max="20" step="1" value="' + (d.water == null ? "" : d.water) + '">' +
        '<span class="note">' + (d.water != null ? pill(waterStatus(d.water)) : "한 잔 = 약 200ml") + "</span>" +
      "</div>" +

      '<div class="field meals-field">' +
        '<span class="flabel">식사 · 식단 · 복약</span>' +
        '<div class="meal-rows" id="mealRows">' +
          MEALS.map(function (m) {
            return '<div class="meal-row">' +
              '<button type="button" data-m="' + m[0] + '" aria-pressed="' + (!!d.meals[m[0]]) + '">' +
                m[1] + "</button>" +
              '<input type="text" data-menu="' + m[0] + '" placeholder="' + m[1] +
                '에 먹은 것 (예: 현미밥, 된장국, 나물)" value="' + esc(menuOf(d, m[0])) +
                '" aria-label="' + m[1] + ' 식단">' +
              '<input type="text" class="pill-in" data-pill="' + m[0] + '" placeholder="' + m[1] +
                '에 먹은 약" value="' + esc(pillOf(d, m[0])) +
                '" aria-label="' + m[1] + ' 복약">' +
            "</div>";
          }).join("") +
        "</div>" +
        '<span class="note">끼니를 누르면 먹은 것으로 기록됩니다. 식단을 적으면 자동으로 체크됩니다. ' +
        '오른쪽 칸에는 그 끼니에 먹은 약을 적습니다</span>' +
      "</div>" +

      '<div class="field">' +
        '<span class="flabel">기분</span>' +
        '<div class="rating" id="moodRate" role="group" aria-label="기분 5점 척도">' + rateBtns(d.mood) + "</div>" +
        '<span class="note">' + moodWord(d.mood) + "</span>" +
      "</div>" +

      '<div class="field">' +
        '<span class="flabel">컨디션</span>' +
        '<div class="rating" id="condRate" role="group" aria-label="컨디션 5점 척도">' + rateBtns(d.condition) + "</div>" +
        '<span class="note">' + condWord(d.condition) + "</span>" +
      "</div>" +

      '<div class="field">' +
        '<span class="flabel">전체평가</span>' +
        '<div class="rating" id="ovRate" role="group" aria-label="전체평가 5점 척도">' + rateBtns(d.overall) + "</div>" +
        '<span class="note">하루를 통틀어 몇 점이었나요</span>' +
      "</div>" +

      '<div class="field memo-field">' +
        '<label for="note">증상 · 메모</label>' +
        '<textarea id="note" placeholder="증상, 약 반응, 그날의 이유 — 나중에 패턴을 찾을 단서">' + esc(d.note || "") + "</textarea>" +
      "</div>";

    function num(el) { return el.value === "" ? null : Number(el.value); }
    function onChange(id, fn) {
      var el = host.querySelector("#" + id);
      el.addEventListener("change", function () { fn(el); });
      return el;
    }

    function commitSleep() {
      var f = readTimeRow(host, "sleepFrom"), t = readTimeRow(host, "sleepTo");
      day(selected).sleep = (!f && !t) ? null : { from: f, to: t };
      save();
      // 폼은 그대로 두고(고르던 중간 상태 보존) 요약 문구만 갱신
      var note = host.querySelector("#sleepNote");
      if (note) note.innerHTML = sleepNoteHtml(sleepHours(day(selected)));
      renderExceptForm();
    }
    ["sleepFrom", "sleepTo"].forEach(function (id) {
      ["Ap", "H", "M"].forEach(function (part) {
        var el = host.querySelector("#" + id + part);
        if (el) el.addEventListener("change", commitSleep);
      });
    });
    onChange("glu",    function (el) { day(selected).glucose = num(el); persist(); });
    onChange("weight", function (el) { day(selected).weight = num(el); persist(); });
    onChange("water",  function (el) { day(selected).water = num(el); persist(); });

    // 두 칸이 다 채워져야 저장되므로, 한 칸만 친 상태에서 폼을 다시 그리면 입력이 지워진다.
    // 수면과 같은 이유로 여기서도 폼은 그대로 두고 나머지 화면만 갱신한다.
    var bpS = host.querySelector("#bpS"), bpD = host.querySelector("#bpD");
    function commitBP() {
      var a = num(bpS), b = num(bpD);
      day(selected).bp = (a == null || b == null) ? null : { s: a, d: b };
      save();
      var note = host.querySelector("#bpNote");
      if (note) note.innerHTML = bpNoteHtml(a, b);
      renderExceptForm();
    }
    bpS.addEventListener("change", commitBP);
    bpD.addEventListener("change", commitBP);

    var exMin = host.querySelector("#exMin"), exKind = host.querySelector("#exKind");
    function commitEx() {
      var m = num(exMin), k = exKind.value.trim();
      day(selected).exercise = (m == null && !k) ? null : { min: m == null ? 0 : m, kind: k };
      persist();
    }
    exMin.addEventListener("change", commitEx);
    exKind.addEventListener("change", commitEx);

    var mealRows = host.querySelector("#mealRows");

    mealRows.addEventListener("click", function (e) {
      var b = e.target.closest("button[data-m]");
      if (!b) return;
      var k = b.getAttribute("data-m");
      day(selected).meals[k] = !day(selected).meals[k];
      persist();
    });

    /* 무엇을 먹었는지 적었다면 그 끼니는 먹은 것이다.
       약은 끼니를 걸러도 먹을 수 있으므로 식사 체크를 건드리지 않는다. */
    mealRows.addEventListener("change", function (e) {
      var menuEl = e.target.closest("input[data-menu]");
      if (menuEl) {
        var k = menuEl.getAttribute("data-menu");
        var d0 = day(selected);
        d0.menu[k] = menuEl.value.trim();
        if (d0.menu[k]) d0.meals[k] = true;
        return persist();
      }
      var pillEl = e.target.closest("input[data-pill]");
      if (pillEl) {
        var pk = pillEl.getAttribute("data-pill");
        day(selected).pill[pk] = pillEl.value.trim();
        return persist();
      }
    });

    bindRate(host.querySelector("#moodRate"), "mood");
    bindRate(host.querySelector("#condRate"), "condition");
    bindRate(host.querySelector("#ovRate"), "overall");

    host.querySelector("#note").addEventListener("change", function () {
      day(selected).note = this.value;
      save();
    });
  }

  function bindRate(group, key) {
    group.addEventListener("click", function (e) {
      var b = e.target.closest("button[data-v]");
      if (!b) return;
      var v = +b.getAttribute("data-v");
      var d = day(selected);
      d[key] = d[key] === v ? null : v;   // 같은 값을 다시 누르면 해제
      persist();
    });
  }

  /* ============================ 렌더 & 이벤트 ============================ */

  function persist() { save(); render(); }

  /* 입력 폼을 제외한 나머지 화면만 갱신한다.
     드롭다운처럼 여러 번에 나눠 고르는 입력은 폼을 다시 그리면
     고르던 중간 상태가 지워지므로, 그럴 때 이 함수를 쓴다. */
  function renderExceptForm() {
    var a = weekStart, b = addDays(weekStart, 6);
    document.getElementById("weekRange").textContent =
      (a.getMonth() + 1) + "월 " + a.getDate() + "일 – " +
      (a.getMonth() === b.getMonth() ? "" : (b.getMonth() + 1) + "월 ") + b.getDate() + "일";

    renderTiles();
    renderLedger();
    renderCharts();
    renderTabs();
  }

  function render() {
    renderExceptForm();
    renderForm();
  }

  document.getElementById("prevWeek").addEventListener("click", function () {
    weekStart = addDays(weekStart, -7); selected = iso(weekStart); render();
  });
  document.getElementById("nextWeek").addEventListener("click", function () {
    weekStart = addDays(weekStart, 7); selected = iso(weekStart); render();
  });
  document.getElementById("thisWeek").addEventListener("click", function () {
    weekStart = mondayOf(new Date()); selected = TODAY; render();
  });

  document.getElementById("dayTabs").addEventListener("click", function (e) {
    var b = e.target.closest("button[data-tab]");
    if (!b) return;
    selected = b.getAttribute("data-tab");
    renderTabs(); renderForm();
  });

  var ledger = document.getElementById("ledger");

  document.getElementById("viewToggle").addEventListener("click", function (e) {
    var b = e.target.closest("button[data-view]");
    if (!b) return;
    view = b.getAttribute("data-view");
    calScroll = 0;
    Array.prototype.forEach.call(this.querySelectorAll("button[data-view]"), function (x) {
      x.setAttribute("aria-pressed", String(x.getAttribute("data-view") === view));
    });
    try { localStorage.setItem(VIEW_STORE, view); } catch (err) { /* 저장 못 해도 화면은 바뀐다 */ }
    renderLedger();
  });

  ledger.addEventListener("click", function (e) {
    var del = e.target.closest("button[data-del]");
    if (del) {
      var k = del.getAttribute("data-del").split("|");
      var d = day(k[0]);
      d.schedule = d.schedule.filter(function (it) { return it.id !== k[1]; });
      keepScroll();
      persist();
      return;
    }
    if (e.target.closest("button#addBtn")) return addFromBar();
    var add = e.target.closest("button[data-add]");
    if (add) return addItem(add.getAttribute("data-add"));

    /* 빈 칸을 누르면 그 날짜·시각으로 아래 입력줄을 채운다 */
    var slot = e.target.closest(".cal-col");
    if (slot && e.target === slot) {
      var r = calRange();
      var minutes = r.lo + Math.floor((e.offsetY / slot.offsetHeight) *
        (r.hi - r.lo) / 30) * 30;
      var dayEl = document.getElementById("addDay");
      if (!dayEl) return;
      dayEl.value = slot.getAttribute("data-slot");
      document.getElementById("addStart").value = fromMin(minutes);
      document.getElementById("addEnd").value = fromMin(Math.min(24 * 60 - 1, minutes + 60));
      document.getElementById("addTitle").focus();
    }
  });

  ledger.addEventListener("change", function (e) {
    /* 할 일은 요약이나 차트에 영향이 없으므로 화면을 다시 그리지 않는다.
       입력 중이던 칸의 초점과 스크롤 위치를 그대로 두기 위함이다. */
    /* Event 칸에 적으면 시간 없는 일정으로 등록한다 */
    var ad = e.target.closest("input[data-adnew]");
    if (ad) {
      var title = ad.value.trim();
      ad.value = "";
      if (!title) return;
      var adDate = ad.getAttribute("data-adnew");
      day(adDate).schedule.push({
        id: uid(), time: "––:––", end: null, title: title, done: false
      });
      keepScroll();
      return persist();
    }

    var td = e.target.closest("input[data-todo], input[data-todotext]");
    if (td) {
      var isText = td.hasAttribute("data-todotext");
      var kk = (td.getAttribute(isText ? "data-todotext" : "data-todo")).split("|");
      var slot = todoSlot(kk[0], +kk[1]);
      if (isText) slot.text = td.value.trim();
      else {
        slot.done = td.checked;
        var row = td.closest(".td-row");
        if (row) row.classList.toggle("done", td.checked);
      }
      return save();
    }

    var t = e.target.closest("input[data-toggle]");
    if (!t) return;
    var k = t.getAttribute("data-toggle").split("|");
    var it = findItem(k[0], k[1]);
    if (!it) return;
    it.done = t.checked;
    keepScroll();
    persist();
  });

  ledger.addEventListener("keydown", function (e) {
    if (e.key !== "Enter") return;
    if (e.target.closest("#addDay, #addStart, #addEnd, #addTitle")) {
      e.preventDefault();
      return addFromBar();
    }
    /* Event 칸은 엔터로도 바로 등록한다 */
    if (e.target.closest("input[data-adnew]")) {
      e.preventDefault();
      e.target.dispatchEvent(new Event("change", { bubbles: true }));
      return;
    }
    var f = e.target.closest("input[data-n], input[data-t]");
    if (!f) return;
    e.preventDefault();
    addItem(f.getAttribute("data-n") || f.getAttribute("data-t"));
  });

  function keepScroll() {
    var body = ledger.querySelector(".cal-body");
    if (body) calScroll = body.scrollTop;
  }

  /* 캘린더 아래 입력줄 */
  function addFromBar() {
    var date = document.getElementById("addDay").value;
    var sEl = document.getElementById("addStart");
    var eEl = document.getElementById("addEnd");
    var nEl = document.getElementById("addTitle");
    var title = nEl.value.trim();
    if (!title) { nEl.focus(); return; }

    var start = normTime(sEl.value);
    var end = eEl.value.trim() ? normTime(eEl.value) : null;
    if (end === "––:––") end = null;

    day(date).schedule.push({
      id: uid(), time: start, end: end, title: title, done: false
    });
    keepScroll();
    persist();

    var again = document.getElementById("addTitle");
    if (again) {
      document.getElementById("addDay").value = date;
      again.focus();
    }
  }

  /* 목록 보기의 날짜별 입력줄 */
  function addItem(date) {
    var row = document.querySelector('input[data-n="' + date + '"]').closest(".add-row");
    var tEl = row.querySelector(".time"), nEl = row.querySelector(".title");
    var title = nEl.value.trim();
    if (!title) { nEl.focus(); return; }
    day(date).schedule.push({
      id: uid(), time: normTime(tEl.value), end: null, title: title, done: false
    });
    tEl.value = ""; nEl.value = "";
    persist();
    var again = document.querySelector('input[data-n="' + date + '"]');
    if (again) again.focus();
  }

  function normTime(v) {
    var s = String(v).trim().replace(/[^\d:]/g, "");
    var m = s.match(/^(\d{1,2}):?(\d{0,2})$/);
    if (!m) return "––:––";
    var h = Math.min(23, +m[1]);
    var mi = m[2] === "" ? 0 : Math.min(59, +m[2]);
    return pad(h) + ":" + pad(mi);
  }

  document.getElementById("clearAll").addEventListener("click", function () {
    if (!window.confirm("이 브라우저에 저장된 기록을 모두 지웁니다. 계속할까요?")) return;
    state.days = {};
    persist();
    stamp("모두 지웠습니다.");
  });

  document.getElementById("exportBtn").addEventListener("click", function () {
    var blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "주간기록부-" + iso(weekStart) + ".json";
    a.click();
    URL.revokeObjectURL(a.href);
  });

  var importFile = document.getElementById("importFile");
  document.getElementById("importBtn").addEventListener("click", function () { importFile.click(); });
  importFile.addEventListener("change", function () {
    var f = this.files && this.files[0];
    if (!f) return;
    var reader = new FileReader();
    reader.onload = function () {
      try {
        var p = JSON.parse(String(reader.result));
        if (!p || !p.days) throw new Error("형식이 다릅니다");
        state = { days: p.days, meds: Array.isArray(p.meds) ? p.meds : [] };
        normalize();
        persist();
        stamp("가져왔습니다.");
      } catch (err) {
        stamp("이 파일은 읽을 수 없습니다 — 내보내기로 만든 JSON을 골라주세요.");
      }
    };
    reader.readAsText(f);
    this.value = "";
  });

  window.addEventListener("resize", function () {
    var open = document.querySelector(".tip.show");
    if (open) open.classList.remove("show");
  });

  Array.prototype.forEach.call(
    document.querySelectorAll("#viewToggle button[data-view]"), function (x) {
      x.setAttribute("aria-pressed", String(x.getAttribute("data-view") === view));
    });

  load();
  render();
})();
</script>
