<title>주간 기록부 — 일정과 건강</title>

<style>
  :root {
    color-scheme: light;
    --plane:        #f3f4f7;
    --surface:      #fbfbfc;
    --surface-2:    #f6f7fa;
    --ink:          #12161c;
    --ink-2:        #565c66;
    --muted:        #868d97;
    --hair:         #e2e5ea;
    --grid:         #e7eaee;
    --baseline:     #c8cdd4;
    --accent:       #1d3a5f;
    --on-accent:    #fbfbfc;
    --accent-soft:  #dfe7f1;
    --s1:           #2a78d6;
    --s2:           #eb6834;
    --s3:           #1baf7a;
    --good:         #0ca30c;
    --warning:      #fab219;
    --serious:      #ec835a;
    --critical:     #d03b3b;
    /* 물 섭취량 — 파랑 단일 색조 순서 램프 (밝은 면에서 2:1 이상) */
    --w1: #86b6ef; --w2: #5598e7; --w3: #2a78d6; --w4: #1c5cab; --w5: #104281;
    --shadow: 0 1px 2px rgba(18,22,28,.05), 0 8px 24px -16px rgba(18,22,28,.18);

    --serif: ui-serif, "Iowan Old Style", "Palatino Linotype", Palatino, "Source Serif Pro", Georgia, serif;
    --sans: system-ui, -apple-system, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --plane:       #0d1014;
      --surface:     #161a20;
      --surface-2:   #1c2128;
      --ink:         #f1f3f6;
      --ink-2:       #a7afba;
      --muted:       #7b838e;
      --hair:        #262c35;
      --grid:        #242a33;
      --baseline:    #363d47;
      --accent:      #9dbfe8;
      --on-accent:   #0d1014;
      --accent-soft: #1e2b3c;
      --s1:          #3987e5;
      --s2:          #d95926;
    --s3:          #199e70;
      --s3:          #199e70;
      --w1: #184f95; --w2: #256abf; --w3: #3987e5; --w4: #6da7ec; --w5: #9ec5f4;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px -16px rgba(0,0,0,.7);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --plane:       #0d1014;
    --surface:     #161a20;
    --surface-2:   #1c2128;
    --ink:         #f1f3f6;
    --ink-2:       #a7afba;
    --muted:       #7b838e;
    --hair:        #262c35;
    --grid:        #242a33;
    --baseline:    #363d47;
    --accent:      #9dbfe8;
    --on-accent:   #0d1014;
    --accent-soft: #1e2b3c;
    --s1:          #3987e5;
    --s2:          #d95926;
    --w1: #184f95; --w2: #256abf; --w3: #3987e5; --w4: #6da7ec; --w5: #9ec5f4;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px -16px rgba(0,0,0,.7);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--plane);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 14px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }

  .wrap {
    max-width: 1200px;
    margin: 0 auto;
    padding: 32px 24px 72px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  /* ---------- 머리글 ---------- */

  .masthead {
    display: flex; flex-wrap: wrap; align-items: flex-end;
    justify-content: space-between; gap: 16px 24px;
    padding-bottom: 18px;
    border-bottom: 2px solid var(--accent);
  }
  .masthead h1 {
    font-family: var(--serif);
    font-size: 30px; font-weight: 600; line-height: 1.1;
    letter-spacing: -.01em; margin: 0; text-wrap: balance;
  }
  .eyebrow {
    font-family: var(--mono); font-size: 10.5px;
    letter-spacing: .14em; text-transform: uppercase;
    color: var(--muted); margin: 0 0 6px;
  }
  .weeknav { display: flex; align-items: center; gap: 8px; }
  .weeknav .range {
    font-family: var(--mono); font-size: 12.5px;
    font-variant-numeric: tabular-nums; color: var(--ink-2);
    min-width: 150px; text-align: center;
  }

  button {
    font: inherit; color: var(--ink);
    background: var(--surface);
    border: 1px solid var(--hair); border-radius: 7px;
    padding: 5px 11px; cursor: pointer;
  }
  button:hover { background: var(--surface-2); border-color: var(--baseline); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .icon-btn { padding: 5px 10px; font-family: var(--mono); line-height: 1.4; }
  .ghost { background: transparent; border-color: transparent; color: var(--ink-2); }
  .ghost:hover { background: var(--surface-2); border-color: var(--hair); }

  /* ---------- 알림 ---------- */

  .notice {
    display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px;
    padding: 11px 14px; background: var(--accent-soft);
    border-radius: 9px; font-size: 13px; color: var(--ink-2);
  }
  .notice strong { color: var(--ink); font-weight: 600; }
  .notice .spacer { flex: 1; }

  /* ---------- 요약 타일 ---------- */

  .tiles {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(146px, 1fr));
    gap: 11px;
  }
  .tile {
    background: var(--surface);
    border: 1px solid var(--hair); border-radius: 11px;
    padding: 13px 14px 14px;
    box-shadow: var(--shadow);
    display: flex; flex-direction: column; gap: 3px;
    min-width: 0;
  }
  .tile .label {
    font-family: var(--mono); font-size: 9.5px;
    letter-spacing: .12em; text-transform: uppercase; color: var(--muted);
  }
  .tile .value {
    font-family: var(--serif); font-size: 25px; font-weight: 600;
    line-height: 1.08; letter-spacing: -.015em;
  }
  .tile .value .unit {
    font-family: var(--sans); font-size: 11.5px; font-weight: 500;
    color: var(--ink-2); letter-spacing: 0; margin-left: 3px;
  }
  .tile .sub { font-size: 11.5px; color: var(--ink-2); }

  .tile.hero {
    grid-column: span 2;
    background: var(--accent); border-color: var(--accent); color: var(--on-accent);
  }
  .tile.hero .label { color: color-mix(in srgb, var(--on-accent) 62%, transparent); }
  .tile.hero .value { font-size: 46px; }
  .tile.hero .value .unit,
  .tile.hero .sub { color: color-mix(in srgb, var(--on-accent) 78%, transparent); }
  .tile.hero .dots i { border-color: color-mix(in srgb, var(--on-accent) 48%, transparent); }
  .tile.hero .dots i.on { background: var(--on-accent); border-color: var(--on-accent); }

  .dots { display: flex; gap: 4px; margin: 3px 0 1px; }
  .dots i { width: 12px; height: 12px; border-radius: 50%; border: 1.5px solid var(--baseline); }
  .dots i.on { background: var(--accent); border-color: var(--accent); }

  /* 상태 알약 — 색 + 기호 + 라벨, 색 단독으로 뜻을 나르지 않음 */
  .pill {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 11px; font-weight: 600;
    padding: 1px 8px 1px 6px; border-radius: 999px;
    background: var(--surface-2); border: 1px solid var(--hair);
    color: var(--ink-2); width: fit-content;
  }
  .pill .glyph { font-family: var(--mono); font-size: 10px; }
  .pill.good     { color: #0a7d0a; border-color: rgba(12,163,12,.35); }
  .pill.warning  { color: #8a6000; border-color: rgba(250,178,25,.45); }
  .pill.serious  { color: #a24a22; border-color: rgba(236,131,90,.45); }
  .pill.critical { color: #b02f2f; border-color: rgba(208,59,59,.4); }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .pill.good     { color: var(--good); }
    :root:not([data-theme="light"]) .pill.warning  { color: var(--warning); }
    :root:not([data-theme="light"]) .pill.serious  { color: var(--serious); }
    :root:not([data-theme="light"]) .pill.critical { color: #ef6a6a; }
  }
  :root[data-theme="dark"] .pill.good     { color: var(--good); }
  :root[data-theme="dark"] .pill.warning  { color: var(--warning); }
  :root[data-theme="dark"] .pill.serious  { color: var(--serious); }
  :root[data-theme="dark"] .pill.critical { color: #ef6a6a; }
  .tile.hero .pill { background: transparent; }

  /* ---------- 패널 ---------- */

  .columns {
    display: grid;
    grid-template-columns: minmax(0, 1.06fr) minmax(0, 1fr);
    gap: 18px; align-items: start;
  }
  .panel {
    background: var(--surface);
    border: 1px solid var(--hair); border-radius: 11px;
    box-shadow: var(--shadow); overflow: hidden;
  }
  .panel > header {
    display: flex; flex-wrap: wrap; align-items: baseline;
    justify-content: space-between; gap: 6px 12px;
    padding: 14px 16px 12px; border-bottom: 1px solid var(--hair);
  }
  .panel h2 {
    font-family: var(--serif); font-size: 16.5px; font-weight: 600;
    margin: 0; letter-spacing: -.005em;
  }
  .panel header .hint { font-size: 11.5px; color: var(--muted); }

  /* ---------- 일정 원장 ---------- */

  .ledger { display: flex; flex-direction: column; }
  .day-row {
    display: grid; grid-template-columns: 60px minmax(0, 1fr);
    gap: 12px; padding: 11px 16px 12px;
    border-bottom: 1px solid var(--hair);
  }
  .day-row:last-child { border-bottom: 0; }
  .day-row.is-today { background: var(--surface-2); }
  .day-row.is-weekend .dow { color: var(--s2); }

  .daystamp { display: flex; flex-direction: column; gap: 1px; padding-top: 2px; }
  .daystamp .dow { font-family: var(--serif); font-size: 15px; font-weight: 600; line-height: 1; }
  .daystamp .date {
    font-family: var(--mono); font-size: 10.5px; color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  .daystamp .today-mark {
    font-family: var(--mono); font-size: 9px; letter-spacing: .1em;
    color: var(--accent); font-weight: 700;
  }

  .items { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
  .item { display: flex; align-items: baseline; gap: 9px; font-size: 13px; min-width: 0; }
  .item .tick {
    appearance: none; -webkit-appearance: none;
    width: 14px; height: 14px; flex: none;
    border: 1.5px solid var(--baseline); border-radius: 4px;
    background: transparent; cursor: pointer; margin: 0;
    position: relative; top: 2px;
  }
  .item .tick:checked { background: var(--accent); border-color: var(--accent); }
  .item .tick:checked::after {
    content: "✓"; position: absolute; inset: 0;
    display: grid; place-items: center;
    font-size: 10px; line-height: 1; color: var(--on-accent);
  }
  .item .tick:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .item .at {
    font-family: var(--mono); font-size: 11.5px; color: var(--ink-2);
    font-variant-numeric: tabular-nums; flex: none; min-width: 82px;
  }
  .item .what { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .item.done .what { color: var(--muted); text-decoration: line-through; }
  .item .del {
    flex: none; border: 0; background: transparent; color: var(--muted);
    font-family: var(--mono); font-size: 13px; padding: 0 4px;
    cursor: pointer; opacity: 0; border-radius: 4px;
  }
  .item:hover .del, .item .del:focus-visible { opacity: 1; }
  .item .del:hover { color: var(--critical); }

  .empty { font-size: 12.5px; color: var(--muted); font-style: italic; margin: 0; }

  .add-row { display: flex; gap: 6px; margin-top: 2px; }
  .add-row input {
    font: inherit; font-size: 12.5px;
    background: var(--surface-2); color: var(--ink);
    border: 1px solid var(--hair); border-radius: 6px;
    padding: 4px 8px; min-width: 0;
  }
  .add-row input:focus-visible { outline: 2px solid var(--accent); outline-offset: -1px; }
  .add-row input.time { width: 64px; font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .add-row input.title { flex: 1; }
  .add-row button { padding: 4px 10px; font-size: 12.5px; }

  /* ---------- 주간 캘린더 ---------- */

  .viewtoggle {
    display: flex; gap: 2px; padding: 2px;
    background: var(--surface-2); border: 1px solid var(--hair); border-radius: 8px;
  }
  .viewtoggle button {
    border: 0; background: transparent; color: var(--muted);
    font-size: 12px; padding: 3px 10px; border-radius: 6px;
  }
  .viewtoggle button[aria-pressed="true"] {
    background: var(--surface); color: var(--ink);
    font-weight: 600; box-shadow: var(--shadow);
  }

  /* 한 화면에 한 주가 들어오도록 시간당 높이를 낮게 잡는다 */
  .cal { --hh: 24px; --gut: 44px; }
  .cal-scroll { overflow-x: auto; }
  .cal-inner { min-width: 680px; }

  .cal-head, .cal-allday, .cal-body {
    display: grid; grid-template-columns: var(--gut) repeat(7, minmax(0, 1fr));
  }
  .cal-head { border-bottom: 1px solid var(--hair); }
  .cal-dh { padding: 7px 6px 8px; text-align: center; border-left: 1px solid var(--hair); }
  .cal-dh .dow {
    display: block; font-family: var(--mono);
    font-size: 10px; letter-spacing: .08em; color: var(--muted);
  }
  .cal-dh .dnum {
    display: inline-grid; place-items: center;
    min-width: 24px; height: 24px; margin-top: 3px;
    font-family: var(--serif); font-size: 15px; font-weight: 600;
    border-radius: 50%; font-variant-numeric: tabular-nums;
  }
  .cal-dh.is-today .dnum { background: var(--accent); color: var(--on-accent); }
  .cal-dh.is-weekend .dow { color: var(--s2); }

  /* Event 줄은 타임라인의 30분 칸과 같은 높이를 기준으로 삼는다 */
  .cal-allday { border-bottom: 1px solid var(--hair); min-height: calc(var(--hh) / 2); }
  .ad-in {
    width: 100%; min-width: 0; font: inherit; font-size: 10.5px;
    height: calc(var(--hh) / 2); line-height: 1;
    border: 0; border-bottom: 1px solid var(--hair);
    background: transparent; color: var(--ink); padding: 0 2px; border-radius: 0;
  }
  .ad-in::placeholder { color: var(--baseline); }
  .ad-in:hover { background: var(--surface); }
  .ad-in:focus-visible { outline: 1.5px solid var(--accent); background: var(--surface); }
  .cal-adlabel {
    display: flex; align-items: center; justify-content: flex-end;
    padding-right: 8px; font-family: var(--mono); font-size: 9.5px; color: var(--muted);
    white-space: nowrap;
  }
  .cal-ad {
    border-left: 1px solid var(--hair); padding: 1px 3px;
    display: flex; flex-direction: column; gap: 1px; min-width: 0;
  }
  /* Event 칩도 30분 칸 높이에 맞춰 한 줄로 */
  .cal-ad .ev.chip {
    height: calc(var(--hh) / 2); padding: 0 4px;
    align-items: center; font-size: 10px; line-height: 1;
  }

  /* 날짜별 할 일 다섯 칸 */
  .cal-todo {
    display: grid; grid-template-columns: var(--gut) repeat(7, minmax(0, 1fr));
    border-bottom: 1px solid var(--hair); background: var(--surface-2);
  }
  .cal-td {
    border-left: 1px solid var(--hair); padding: 3px 4px;
    display: flex; flex-direction: column; gap: 1px; min-width: 0;
  }
  .td-row { display: flex; align-items: center; gap: 4px; min-width: 0; }
  .td-row input[type="checkbox"] {
    appearance: none; -webkit-appearance: none; flex: none; margin: 0;
    width: 11px; height: 11px; border: 1.4px solid var(--baseline);
    border-radius: 3px; background: transparent; cursor: pointer; position: relative;
  }
  .td-row input[type="checkbox"]:checked { background: var(--accent); border-color: var(--accent); }
  .td-row input[type="checkbox"]:checked::after {
    content: "✓"; position: absolute; inset: 0; display: grid; place-items: center;
    font-size: 8px; line-height: 1; color: var(--on-accent);
  }
  .td-row input[type="checkbox"]:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .td-in {
    flex: 1; min-width: 0; font: inherit; font-size: 10.5px; line-height: 1.3;
    border: 0; border-bottom: 1px solid var(--hair);
    background: transparent; color: var(--ink); padding: 0 2px 1px;
    border-radius: 0;
  }
  .td-in::placeholder { color: var(--baseline); }
  .td-in:hover { background: var(--surface); }
  .td-in:focus-visible { outline: 1.5px solid var(--accent); outline-offset: 0; background: var(--surface); }
  .td-row.done .td-in { color: var(--muted); text-decoration: line-through; }

  .cal-body { max-height: 400px; overflow-y: auto; }
  .cal-hr {
    height: var(--hh); padding-right: 8px; text-align: right;
    font-family: var(--mono); font-size: 10px; color: var(--muted);
    font-variant-numeric: tabular-nums; transform: translateY(-6px);
  }
  .cal-col {
    position: relative; border-left: 1px solid var(--hair);
    background-image: repeating-linear-gradient(
      to bottom, var(--hair) 0 1px, transparent 1px var(--hh));
  }
  .cal-col.is-today { background-color: var(--surface-2); }
  .cal-col.is-open { cursor: cell; }

  .ev {
    position: absolute; display: flex; gap: 4px; align-items: flex-start;
    overflow: hidden; padding: 3px 5px; border-radius: 6px;
    border: 1px solid var(--surface);
    background: var(--accent); color: var(--on-accent);
    font-size: 11.5px; line-height: 1.25; min-width: 0;
  }
  .ev.chip { position: static; padding: 2px 6px; }
  .ev.short { padding: 1px 5px; font-size: 10.5px; line-height: 1.15; }
  .ev .txt { min-width: 0; }
  .ev .t {
    display: block; font-family: var(--mono); font-size: 9.5px; opacity: .82;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .ev .n { display: block; overflow-wrap: anywhere; }
  /* 30분처럼 낮은 칸은 시간과 내용을 한 줄에 붙인다 */
  .ev.short { align-items: center; }
  .ev.short .txt { display: flex; gap: 5px; align-items: baseline; }
  .ev.short .t { flex: none; }
  .ev.short .n { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* 겹쳐서 좁아진 칸은 시간을 접고 내용에 자리를 준다 (전체 시각은 hover 툴팁) */
  .ev.tight .t { display: none; }
  .ev.tight.short .txt { display: block; }
  .ev.done { opacity: .52; }
  .ev.done .n { text-decoration: line-through; }
  .ev .tick {
    appearance: none; -webkit-appearance: none;
    width: 12px; height: 12px; flex: none; margin: 1px 0 0;
    border: 1.5px solid currentColor; border-radius: 3px;
    background: transparent; cursor: pointer; position: relative;
  }
  .ev .tick:checked::after {
    content: "✓"; position: absolute; inset: 0;
    display: grid; place-items: center; font-size: 9px; line-height: 1;
  }
  .ev .tick:focus-visible { outline: 2px solid var(--on-accent); outline-offset: 1px; }
  .ev .del {
    position: absolute; top: 0; right: 0; opacity: 0;
    border: 0; background: transparent; color: inherit;
    font-family: var(--mono); font-size: 11px; padding: 1px 4px; cursor: pointer;
  }
  .ev:hover .del, .ev .del:focus-visible { opacity: .9; }

  .nowline {
    position: absolute; left: 0; right: 0; height: 0; z-index: 2;
    border-top: 2px solid var(--critical); pointer-events: none;
  }
  .nowline::before {
    content: ""; position: absolute; left: -3px; top: -4px;
    width: 6px; height: 6px; border-radius: 50%; background: var(--critical);
  }

  .cal-add {
    display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
    padding: 10px 14px; border-top: 1px solid var(--hair);
  }
  .cal-add select, .cal-add input {
    font: inherit; font-size: 12.5px;
    background: var(--surface-2); color: var(--ink);
    border: 1px solid var(--hair); border-radius: 6px; padding: 4px 8px; min-width: 0;
  }
  .cal-add select:focus-visible, .cal-add input:focus-visible {
    outline: 2px solid var(--accent); outline-offset: -1px;
  }
  .cal-add input.time {
    width: 62px; font-family: var(--mono); font-variant-numeric: tabular-nums;
  }
  .cal-add input.title { flex: 1; min-width: 120px; }
  .cal-add .dash { font-family: var(--mono); color: var(--muted); }

  /* ---------- 생활 체크 격자 ---------- */

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .cell.w4,
    :root:not([data-theme="light"]) .cell.w5 { color: #0d1014; }
  }
  :root[data-theme="dark"] .cell.w4,
  :root[data-theme="dark"] .cell.w5 { color: #0d1014; }

  /* ---------- 차트 ---------- */

  /* 두 열 — 지표 6개가 3행, 마지막 종합 차트가 한 행을 통째로 */
