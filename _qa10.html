<!doctype html><meta charset="utf-8"><title>지난 기록 줄이기·별점 시험</title>
<div id="out" style="font:13px/1.7 ui-monospace"></div>
<iframe id="f" src="/_fix_past.html#/seen" style="width:1240px;height:100px;border:0"></iframe>
<script>
var out=document.getElementById("out"),f=document.getElementById("f"),pass=0,fail=0;
function log(ok,n,e){(ok?pass++:fail++);
 out.insertAdjacentHTML("beforeend",(ok?"통과  ":"X 실패  ")+n+(e?"   "+e:"")+"<br>");}
function ev(w,el,t){el.dispatchEvent(new w.Event(t,{bubbles:true}));}
f.onload=function(){var w=f.contentWindow,d=f.contentDocument;
 w.onerror=function(m,s,l){log(false,"앱 오류",m+" ("+l+"줄)");};
 setTimeout(function(){
  var L=d.getElementById("movieList");
  log(L.querySelectorAll(".mt").length===1,"고른 날 것이 펼쳐진다",
    L.querySelectorAll(".mt").length+"개");
  var rows=L.querySelectorAll("[data-nrow]");
  log(rows.length===3,"요약이 세 줄",rows.length+"줄");
  log(L.querySelector(".pasttitle .more")&&
      L.querySelector(".pasttitle .more").textContent.indexOf("3건")!==-1,
    "더 있으면 몇 건인지 알린다",L.querySelector(".pasttitle .more")&&
      L.querySelector(".pasttitle .more").textContent.trim());

  /* 줄을 누르면 펼쳐진다 */
  rows[0].click();
  setTimeout(function(){
   var opened=L.querySelector(".vopen .mt");
   log(!!opened,"줄을 누르면 펼쳐진다");
   log(!!opened.querySelector(".mt-trio"),"펼친 것도 오늘 것과 같은 모양");
   /* 다시 누르면 접힌다 — 고른 날 것이 대신 펼쳐지므로 그 줄이 닫혔는지로 본다 */
   var was=L.querySelector("[data-nrow][aria-expanded='true']");
   if(was) was.click();
   setTimeout(function(){
    log(!L.querySelector("[data-nrow][aria-expanded='true']")||
        L.querySelectorAll(".vopen").length<=1,"다시 누르면 접힌다");

    /* 별점 — 영화에는 있고 여행에는 없다 */
    L.querySelector("[data-nrow]").click();
    var card=L.querySelector(".mt");
    var keys=[].map.call(card.querySelectorAll(".mt-key"),function(x){return x.textContent;});
    log(keys.indexOf("별점")!==-1,"영화에 별점이 있다",keys.join(","));
    d.getElementById("tripAdd").click();
    setTimeout(function(){
     var tc=d.querySelector("#tripList .mt");
     var tk=[].map.call(tc.querySelectorAll(".mt-key"),function(x){return x.textContent;});
     log(tk.indexOf("별점")===-1,"여행에는 별점이 없다",tk.join(","));

     /* 별을 눌러 저장 */
     var sb=card.querySelectorAll('.starpick button[data-notestar]');
     log(sb.length>=5,"별을 누를 수 있다",sb.length+"개");
     sb[1].click();
     setTimeout(function(){
      var st=JSON.parse(w.localStorage.getItem("weekly-health-ledger-v3"));
      var ok=false;Object.keys(st.days).forEach(function(k){
       ((st.days[k].movie)||[]).forEach(function(v){if(v.title==="오펜하이머"&&v.star===2)ok=true;});});
      log(ok,"별점이 저장된다");

      /* 찾으면 지난 것도 다 나온다 */
      var q=d.querySelector('input[data-find="movie"]');
      q.value="봄"; ev(w,q,"input");
      setTimeout(function(){
       var n=d.getElementById("movieList").querySelectorAll("[data-nrow]").length;
       log(n===3,"찾으면 줄로 셋 보여준다",n+"줄");
       log(!!d.getElementById("movieList").querySelector(".pasttitle .more"),
         "찾는 중에도 나머지 건수를 알린다");
       out.insertAdjacentHTML("beforeend","<b>통과 "+pass+" · 실패 "+fail+"</b>");
      },400);
     },300);
    },300);
   },300);
  },300);
 },1200);};
</script>
